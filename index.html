<style>
:root{
  color-scheme:light;
  --bg:#f7f5ef; --card:#ffffff; --ink:#1c1c1e; --muted:#6b6b70; --line:#dedad0;
  --grid:rgba(60,90,160,.09); --grid2:#cfd6e6;
  --blue:#2459c6; --blue-fill:#dbe6fb;
  --amber:#a86400; --amber-fill:#fde9c4;
  --red:#c62f45; --red-fill:#fbd9de; --green-fill:#d6f0e1;
  --green:#1d7a4c;
  --accent:#2459c6; --accent-ink:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --r:14px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16171a; --card:#212226; --ink:#ececee; --muted:#a0a0a8; --line:#34353b;
  --grid:rgba(140,170,255,.08); --grid2:#3a4256;
  --blue:#7ea6ff; --blue-fill:#22345c;
  --amber:#f0b04a; --amber-fill:#4a3712;
  --red:#ff7b8e; --red-fill:#4d2129; --green-fill:#173a2a;
  --green:#5fd39a;
  --accent:#7ea6ff; --accent-ink:#0f1320;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:56px;padding-top:4px;padding-bottom:4px}
.back{display:none;align-items:center;justify-content:center;min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;font-size:26px;cursor:pointer;flex:none}
.back:hover{background:var(--line)}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.bar h1{font-size:19px;margin:0;font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar .crumb{color:var(--muted);font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumb:empty{display:none}
.ibtn,.themebtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink);padding:0 8px;font-size:15px;white-space:nowrap;flex:none}
.ibtn:hover,.themebtn:hover{background:var(--line)}
.ibtn svg,.themebtn svg{width:22px;height:22px;display:block;flex:none}
.ibtn[hidden],.themebtn[hidden]{display:none}
.ibtn .lbl{display:none}
@media (min-width:900px){
  .ibtn{border:1px solid var(--line);background:var(--card);height:40px;padding:0 12px}
  .ibtn .lbl{display:inline}
  .phone-only{display:none !important}
}
@media (max-width:899px){
  .wide-only{display:none !important}
  .ibtn,.themebtn{min-width:40px;padding:0 6px}
  .back{min-width:40px}
  .bar .wrap{gap:4px}
  .bar h1{font-size:15px}
  .bar .crumb{font-size:12px}
}

.hero{padding:28px 0 8px}
.hero h2{font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.level{margin:22px 0 30px}
.level h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:inherit;min-height:150px}
.card:hover{border-color:var(--accent)}
.card .thumb{height:64px;margin-bottom:4px;flex:none}
.card .txt{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.card b{font-size:18px}
.card span{color:var(--muted);font-size:15px}
.card .tags{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}

.tabs{display:flex;gap:6px;padding:12px 0}
.tab{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;padding:0 18px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.play{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:18px;padding-bottom:24px;align-items:start}
.left{position:sticky;top:calc(var(--barh,56px) + 12px);display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;position:relative}
.stage svg text{paint-order:stroke;stroke:var(--card);stroke-width:1.2px;stroke-linejoin:round}
.stage svg{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);touch-action:none}
.key{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 12px 10px}
.key.empty{display:none}
.sheetlink{text-decoration:none;align-self:flex-start;font-weight:400}
.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stepnum{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.steptext{font-size:20px;margin:8px 0 0;min-height:3.2em}
.steptext .m{white-space:nowrap}
.nav{display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}

<script>
const LEVELS = [
  {id:"sec1", name:"Sec 1"},
  {id:"sec2", name:"Sec 2"},
  {id:"emath", name:"E-Math (Sec 3–4)"},
  {id:"amath", name:"A-Math (Sec 3–4)"}
];

const TOPICS = [
  {id:"a-plus-b-squared", strand:"alg", levels:["sec2"], chapter:"Expansion & Factorisation",
   title:"Why (a + b)² = a² + 2ab + b²", blurb:"Cut a square into 4 pieces and see where the 2ab comes from.", play:"squareAB", sheet:"expansion"},
  {id:"complete-square", strand:"alg", levels:["emath","amath"], chapter:"Quadratic Functions",
   title:"Completing the square, with areas", blurb:"Cut, move and fill in the missing corner.", play:"complSq", sheet:"complSq", sheetTitle:"Completing the square"},
  {id:"quad-forms", strand:"alg", levels:["emath","amath"], chapter:"Quadratic Functions",
   title:"Quadratic graphs: 3 forms", blurb:"Drag the turning point. See all three forms change together.", play:"quadForms", sheet:"quadGraphs", sheetTitle:"Quadratic graphs"},
  {id:"discriminant", strand:"alg", levels:["amath"], chapter:"Equations & Inequalities",
   title:"Line meets curve: b² − 4ac", blurb:"Slide a line: cuts, touches or misses?", play:"discrim", sheet:"discrim", sheetTitle:"b² − 4ac (discriminant)"},
  {id:"unit-circle", strand:"trig", levels:["amath"], chapter:"Trigonometry",
   title:"Unit circle & ASTC", blurb:"Tap the 16 special angles. Same height in every quadrant, only the sign changes.", play:"unitCircle", sheet:"trigAngles", sheetTitle:"Trig ratios of any angle"},
  {id:"trig-graphs", strand:"trig", levels:["amath"], chapter:"Trigonometry",
   title:"Trig graphs: what a, b, c do", blurb:"Stretch, squeeze and shift sin, cos and tan.", play:"trigGraphs", sheet:"trigGraphs", sheetTitle:"Trig graphs"},
  {id:"r-formula", strand:"trig", levels:["amath"], chapter:"Trigonometry",
   title:"R-formula: two waves make one", blurb:"Where R and α come from, and why max = R.", play:"rFormula", sheet:"rFormula", sheetTitle:"R-formula"},
  {id:"circle-props", strand:"geo", levels:["emath","amath"], chapter:"Properties of Circles",
   title:"Circle angle properties", blurb:"Drag points and watch the angles stay true. 7 properties.", play:"circleProps", sheet:"circles", sheetTitle:"Circle properties"},
  {id:"diff-x-squared", strand:"calc", levels:["amath"], chapter:"Differentiation",
   title:"Why x² differentiates to 2x", blurb:"Slide Q into P: the chord becomes the tangent, and its gradient is 2x.", play:"diffChord", sheet:"diffBasics", sheetTitle:"Differentiation rules"},
  {id:"tangent-gradient", strand:"calc", levels:["amath"], chapter:"Differentiation",
   title:"Tangents, gradient & stationary points", blurb:"Slide the tangent. Uphill, downhill, flat. Gradient graph underneath.", play:"tangentAid", sheet:"diffApps", sheetTitle:"Uses of differentiation"},
  {id:"general-term", strand:"calc", levels:["amath"], chapter:"Differentiation",
   title:"Put in x, get the gradient", blurb:"Put r into the general term to get any term. Put x into the gradient formula to get the gradient anywhere.", play:"genTerm", sheet:"diffBasics", sheetTitle:"Differentiation rules"},
  {id:"speed-time", strand:"alg", levels:["emath"], chapter:"Speed–time graphs",
   title:"Speed–time & distance–time graphs", blurb:"Drag the corners of a journey. Area = distance, gradient = acceleration.", play:"speedTime", sheet:"speedTime", sheetTitle:"Speed–time graphs"},
  {id:"area-under", strand:"calc", levels:["amath"], chapter:"Kinematics",
   title:"Kinematics: s, v, a", blurb:"A particle on a line, with its s, v and a graphs. At rest, turning round, area = displacement.", play:"kinAid", sheet:"kinematics", sheetTitle:"Kinematics"}
];

const $ = (s,el=document)=>el.querySelector(s);
const h = (tag,attrs={},html="")=>{const e=document.createElement(tag);for(const k in attrs)e.setAttribute(k,attrs[k]);e.innerHTML=html;return e};
const SVGNS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs={},text){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
const fmt=(n,d=2)=>{const s=(+n).toFixed(d);return s.replace(/\.?0+$/,"")||"0"};
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const BIN=(n,r)=>`<span class="binom"><span class="p">(</span><span class="st"><span>${n}</span><span>${r}</span></span><span class="p">)</span></span>`;
const fx=s=>String(s).replace(/\{([^/}]*)\/([^}]*)\}/g,(m,n,d)=>frac(n,d));
const V=s=>`<i class="v">${s}</i>`;

const squareAB = {
  steps:[
    {t:()=>`Here is a square. Each side is ${V("a")} + ${V("b")}.<br>So its area is (${V("a")} + ${V("b")})².`, show:{split:false}},
    {t:()=>`Cut each side into ${V("a")} and ${V("b")}. The square breaks into <b>4 pieces</b>.`, show:{split:true}},
    {t:()=>`Top-left piece: ${V("a")} × ${V("a")} = <span class="k-blue">${V("a")}²</span>`, show:{split:true,hi:"aa"}},
    {t:()=>`Two rectangles: ${V("a")} × ${V("b")} each.<br>Together = <span class="k-amber">2${V("ab")}</span>`, show:{split:true,hi:"ab"}},
    {t:()=>`Bottom-right piece: ${V("b")} × ${V("b")} = <span class="k-red">${V("b")}²</span>`, show:{split:true,hi:"bb"}},
    {t:()=>`Add all 4 pieces:<br><b>(${V("a")} + ${V("b")})² = <span class="k-blue">${V("a")}²</span> + <span class="k-amber">2${V("ab")}</span> + <span class="k-red">${V("b")}²</span></b>`, show:{split:true,hi:"all"}},
    {t:()=>`<span class="k-red">Common mistake:</span> (${V("a")} + ${V("b")})² = ${V("a")}² + ${V("b")}² ✗<br>That forgets the <span class="k-amber">2 rectangles</span>!`, show:{split:true,hi:"mistake"}}
  ],
  mount(stage,panel,key,prm){
    const st={a:prmNum(prm,"a",1,8,5),b:prmNum(prm,"b",1,6,3),step:5}; if(cur) cur.state=()=>({a:st.a,b:st.b});
    const svg=svgEl("svg",{viewBox:"0 0 130 126","aria-label":"Square of side a plus b split into four pieces"});
    stage.append(svg); const kb=h("div",{class:"keybox"}); key.append(kb); key.classList.remove("empty");
    panel.innerHTML=`${explainBox([`Big square = 4 pieces:<br><b>${nw(`(${V("a")} + ${V("b")})²`)} = ${nw(`${V("a")}² + 2${V("ab")} + ${V("b")}²`)}</b>`,`Don't forget the <span class="k-amber"><b>2 rectangles</b></span>!`])}
      <span class="dockslot" hidden></span>
      <div class="box dock">
        <div class="ctrl"><label for="sa">a</label><input id="sa" type="range" min="1" max="8" step="1" value="5"><output></output></div>
        <div class="ctrl"><label for="sb">b</label><input id="sb" type="range" min="1" max="6" step="1" value="3"><output></output></div>
      </div>
      <div class="box robox"><div class="readout" id="ro"></div></div>
      <p class="hint">Drag the sliders or type a number. The rule works for any a and b.</p>`;
    const sa=$("#sa",panel), sb=$("#sb",panel), ro=$("#ro",panel);
    const draw=()=>{
      const {a,b,step}=st, S=this.steps[step].show;
      $("output",sa.closest(".ctrl")).textContent=a; $("output",sb.closest(".ctrl")).textContent=b;
      svg.innerHTML="";
      const sc=92/(a+b), x0=26, y0=12, A=a*sc, B=b*sc, T=A+B;
      const fade=k=>{ if(!S.split) return 1; if(!S.hi||S.hi==="all") return 1;
        if(S.hi==="mistake") return k==="ab"?1:.45; return S.hi===k?1:.25; };
      if(!S.split){
        svg.append(svgEl("rect",{x:x0,y:y0,width:T,height:T,fill:"var(--blue-fill)",stroke:"var(--ink)","stroke-width":.8}));
        svg.append(svgEl("text",{x:x0+T/2,y:y0+T/2+2.5,"text-anchor":"middle","font-size":7,fill:"var(--ink)","font-style":"italic"},"(a + b)²"));
        svg.append(svgEl("text",{x:x0+T/2,y:y0-3.5,"text-anchor":"middle","font-size":6,fill:"var(--ink)","font-style":"italic"},`a + b = ${a+b}`));
        svg.append(svgEl("text",{x:x0-4,y:y0+T/2,"text-anchor":"middle","font-size":6,fill:"var(--ink)","font-style":"italic",transform:`rotate(-90 ${x0-4} ${y0+T/2})`},`a + b = ${a+b}`));
      } else {
        const piece=(x,y,w,hh,fill,lab,col,k,val)=>{
          const g=svgEl("g",{opacity:fade(k)});
          g.append(svgEl("rect",{x,y,width:w,height:hh,fill,stroke:"var(--ink)","stroke-width":.8}));
          const fs=Math.max(3.4,Math.min(7,Math.min(w,hh)*.42));
          g.append(svgEl("text",{x:x+w/2,y:y+hh/2+(val!=null?-fs*.1:fs*.35),"text-anchor":"middle","font-size":fs,fill:col,"font-weight":700,"font-style":"italic"},lab));
          if(val!=null){const f2=Math.max(3.2,fs*.72); g.append(svgEl("text",{x:x+w/2,y:y+hh/2+fs*.1+f2,"text-anchor":"middle","font-size":f2,fill:col,"font-weight":700},"= "+val));}
          if(S.hi==="mistake"&&k==="ab"){
            g.append(svgEl("rect",{x:x+1,y:y+1,width:w-2,height:hh-2,fill:"none",stroke:"var(--red)","stroke-width":1.2,"stroke-dasharray":"2.5 1.5"}));
          }
          svg.append(g);
        };
        piece(x0,y0,A,A,"var(--blue-fill)","a²","var(--blue)","aa",a*a);
        piece(x0+A,y0,B,A,"var(--amber-fill)","ab","var(--amber)","ab",a*b);
        piece(x0,y0+A,A,B,"var(--amber-fill)","ab","var(--amber)","ab",a*b);
        piece(x0+A,y0+A,B,B,"var(--red-fill)","b²","var(--red)","bb",b*b);
        const lab=(x,y,t,anchor="middle")=>svg.append(svgEl("text",{x,y,"text-anchor":anchor,"font-size":6,fill:"var(--ink)","font-style":"italic"},t));
        lab(x0+A/2,y0-3.5,`a = ${a}`); lab(x0+A+B/2,y0-3.5,`b = ${b}`);
        lab(x0-3.5,y0+A/2+2,`a = ${a}`,"end"); lab(x0-3.5,y0+A+B/2+2,`b = ${b}`,"end");
        [[x0,y0-1.5,x0,y0-6],[x0+A,y0-1.5,x0+A,y0-6],[x0+T,y0-1.5,x0+T,y0-6],
         [x0-1.5,y0,x0-6,y0],[x0-1.5,y0+A,x0-6,y0+A],[x0-1.5,y0+T,x0-6,y0+T]]
         .forEach(([x1,y1,x2,y2])=>svg.append(svgEl("line",{x1,y1,x2,y2,stroke:"var(--muted)","stroke-width":.5})));
      }
      const tot=(a+b)**2;

  <div class="panelc"><h4>Picture it</h4>

diffBasics:`${MUST([FB("blue","Power rule",`${frac("d","d"+X1)}(${X1}<sup>${V("n")}</sup>) = ${V("n")}${X1}<sup>${V("n")} − 1</sup>`,"power down in front, then power − 1"),FB("amber","Chain rule",`${nw(`(${V("u")})<sup>${V("n")}</sup>`)} → ${nw(`${V("n")}(${V("u")})<sup>${V("n")} − 1</sup>`)} × ${nw(frac("d"+V("u"),"d"+X1))}`,"outside first, × the inside differentiated"),FB("green","Product and quotient",`${V("uv")} → ${V("u")}${V("v")}′ + ${V("v")}${V("u")}′`,`quotient: ${nw("diff top × copy bottom")} ${nw("− diff bottom × copy top")}, over bottom²`)])}
<div class="sheet">
  <div class="panelc"><h4>Power rule</h4>
    <p class="big">${frac("d","d"+V("x"))}(${V("x")}<sup>${V("n")}</sup>) = ${V("n")}${V("x")}<sup>${V("n")} − 1</sup></p>
    <p class="anno" style="text-align:center">bring the power down in front, then ${nw("power − 1")}</p>
    <table>
      <tr><th>${V("y")}</th><th>${frac("d"+V("y"),"d"+V("x"))}</th></tr>
      <tr><td>${V("x")}²</td><td>2${V("x")}</td></tr>
      <tr><td>${V("x")}³</td><td>3${V("x")}²</td></tr>
      <tr><td>5${V("x")}⁴</td><td>20${V("x")}³</td></tr>
      <tr><td>${V("x")} </td><td>1</td></tr>
      <tr><td>7 <span class="anno">(constant)</span></td><td>0</td></tr>
    </table>
    <p class="anno">* a number in front stays in front: 5${V("x")}⁴ → 5 × 4${V("x")}³ = 20${V("x")}³</p>
  </div>

  <div class="panelc"><h4>Rewrite first, then differentiate</h4>
    <table>
      <tr><th>${V("y")}</th><th>Rewrite</th><th>${frac("d"+V("y"),"d"+V("x"))}</th></tr>
      <tr><td>${frac("1",V("x"))}</td><td>${V("x")}<sup>−1</sup></td><td>−${V("x")}<sup>−2</sup> = −${frac("1",V("x")+"²")}</td></tr>
      <tr><td>${frac("1",V("x")+"²")}</td><td>${V("x")}<sup>−2</sup></td><td>−2${V("x")}<sup>−3</sup> = −${frac("2",V("x")+"³")}</td></tr>
      <tr><td>√${V("x")}</td><td>${V("x")}<sup>½</sup></td><td>½${V("x")}<sup>−½</sup> = ${frac("1","2√"+V("x"))}</td></tr>
    </table>
    <div class="wrongright">
      <div class="x">✗ ${frac("d","d"+V("x"))}(${frac("1",V("x")+"²")}) = ${frac("1","2"+V("x"))}</div>
      <div class="ok">✓ ${V("x")}<sup>−2</sup><br>→ −2${V("x")}<sup>−3</sup> = −${frac("2",V("x")+"³")}</div>
    </div>
    <div class="note"><b>Note!</b> Never differentiate the denominator on its own. Change to a negative power first.</div>
  </div>

  <div class="panelc"><h4>All the rules <span class="badge">memorise: not on the formula sheet</span></h4>
    <table>
      <tr><th>${V("y")}</th><th>${frac("d"+V("y"),"d"+V("x"))}</th></tr>
      <tr><td>sin ${X1}</td><td>cos ${X1}</td></tr>
      <tr><td>cos ${X1}</td><td>−sin ${X1}</td></tr>
      <tr><td>tan ${X1}</td><td>sec² ${X1}</td></tr>
      <tr><td>e<sup>${X1}</sup></td><td>e<sup>${X1}</sup></td></tr>
      <tr><td>ln ${X1}</td><td>${frac("1",X1)}</td></tr>
      <tr><td>Chain rule: <span class="nw">(2${X1} + 1)⁵</span></td><td><span class="nw">5(2${X1} + 1)⁴ × 2</span> = <span class="nw">10(2${X1} + 1)⁴</span></td></tr>
      <tr><td><span class="nw">sin(${V("a")}${X1} + ${V("b")})</span></td><td><span class="nw">${V("a")} cos(${V("a")}${X1} + ${V("b")})</span></td></tr>
      <tr><td>e<sup>${V("a")}${X1} + ${V("b")}</sup></td><td>${V("a")}e<sup>${V("a")}${X1} + ${V("b")}</sup></td></tr>
      <tr><td><span class="nw">ln(${V("a")}${X1} + ${V("b")})</span></td><td>${frac(V("a"),V("a")+X1+" + "+V("b"))}</td></tr>
      <tr><td>Product: ${V("uv")}</td><td>${V("u")}${frac("d"+V("v"),"d"+V("x"))} + ${V("v")}${frac("d"+V("u"),"d"+V("x"))}</td></tr>
      <tr><td>Quotient: ${frac(V("u"),V("v"))}</td><td>${frac(V("v")+frac("d"+V("u"),"d"+V("x"))+" − "+V("u")+frac("d"+V("v"),"d"+V("x")),V("v")+"²")}</td></tr>
    </table>
    <p class="anno">* quotient: differentiate top, copy bottom, minus differentiate bottom, copy top, over bottom squared</p>
    <p class="anno">* trig rules need ${X1} in radians · chain rule: differentiate the outside, ${nw("then × the inside")} differentiated</p>
  </div>

  <div class="panelc"><h4>Term by term</h4>
    <ul class="steps">
      <li>${V("y")} = 4${V("x")}³ − 6${V("x")}² + 5${V("x")} − 9</li>
      <li>${frac("d"+V("y"),"d"+V("x"))} = 12${V("x")}² − 12${V("x")} + 5 <span class="tagop">the −9 becomes 0</span></li>
    </ul>
    <p class="anno">* differentiate each term on its own; a number in front stays in front</p>
  </div>

  <div class="panelc"><h4>What ${frac("d"+V("y"),"d"+V("x"))} means</h4>
    <ul class="steps">
      <li>① gradient of the tangent at a point</li>
      <li>② rate of change of ${V("y")} as ${V("x")} changes</li>
    </ul>
    ${EG(`e.g. gradient of ${V("y")} = ${V("x")}² at ${V("x")} = 3`,[`${nw(`${frac("d"+V("y"),"d"+V("x"))} = 2${V("x")}`)}`,`${nw(`= 2(3) = <b>6</b>`)}`])}
  </div>

  <div class="panelc"><h4>${frac("d"+V("y"),"d"+V("x"))} is a general term</h4>
    <table>
      <tr><th></th><th>Binomial</th><th>Curve</th></tr>
      <tr><td>One formula</td><td>${nw(`T<sub>${V("r")} + 1</sub> = ${BIN(V("n"),V("r"))}${V("a")}<sup>${V("n")} − ${V("r")}</sup>${V("b")}<sup>${V("r")}</sup>`)}</td><td>${nw(`${frac("d"+V("y"),"d"+V("x"))} = 2${V("x")}`)} for ${nw(`${V("y")} = ${X2}`)}</td></tr>
      <tr><td>Put in</td><td>${nw(`${V("r")} = 2`)} → the 3rd term</td><td>${nw(`${X1} = 3`)} → the gradient at ${nw(`${X1} = 3`)}</td></tr>
      <tr><td>Gives</td><td><b>every</b> term</td><td>the gradient at <b>every</b> point</td></tr>
    </table>
    ${PLAYLINK("#general-term","Interactive: one formula, every gradient")}
  </div>

  <div class="panelc"><h4>Why ${V("x")}² → 2${V("x")}</h4>
    <a href="#diff-x-squared?x=1&h=1.5" class="piclink"><svg viewBox="0 0 220 100" style="width:100%;max-width:300px;display:block;margin:0 auto">
      <path d="M20 90 Q110 -70 200 90" fill="none" stroke="var(--blue)" stroke-width="2"/>
      <line x1="30" y1="86" x2="150" y2="22" stroke="var(--amber)" stroke-width="2"/>
      <line x1="40" y1="96" x2="120" y2="42" stroke="var(--green)" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="66" cy="66" r="4" fill="var(--accent)"/><circle cx="119" cy="39" r="4" fill="var(--amber)"/>
      <text x="56" y="82" font-size="13" font-weight="700" fill="var(--ink)">P</text><text x="124" y="34" font-size="13" font-weight="700" fill="var(--amber)">Q</text>
      <text x="150" y="80" font-size="12" fill="var(--amber)">chord PQ</text><text x="150" y="95" font-size="12" fill="var(--green)">tangent at P</text>
    </svg></a>
    <ul class="steps">
      <li>Chord PQ: gradient = ${nw("rise ÷ run")} = ${nw(`2${V("x")} + ${V("h")}`)}</li>
      <li>Slide Q into P (${V("h")} → 0): the chord becomes the <b>tangent</b></li>
      <li>Gradient → <b>2${V("x")}</b>, so ${frac("d","d"+V("x"))}(${V("x")}²) = 2${V("x")}</li>
    </ul>
    <p class="anno">Not needed in the exam. It shows why the power rule works.</p>
    ${PLAYLINK("#diff-x-squared","Interactive: slide Q into P")}
  </div>
</div>`,

complSq:`${MUST([FB("blue",`${X2} + ${V("b")}${X1} + ${V("c")}`,`${nw(`(${X1} + ${frac(V("b"),"2")})²`)} − ${nw(`(${frac(V("b"),"2")})²`)} + ${V("c")}`,"halve b · add and take away its square"),FB("amber","Turning point",nw(`(−${frac(V("b"),"2")}, ${V("c")} − (${frac(V("b"),"2")})²)`),"read it off the completed square"),FB("green","Min or max value",`${V("k")}, when ${X1} = ${V("h")}`,`from ${V("y")} = ${V("a")}(${X1} − ${V("h")})² + ${V("k")}`)])}
<div class="sheet">
  <div class="panelc"><h4>3 steps: x² + bx + c</h4>
    <ul class="steps">
      <li>① Halve ${V("b")}: ${frac(V("b"),"2")}</li>
      <li>② Add <b>and</b> take away (${frac(V("b"),"2")})²</li>
      <li>③ The first 3 terms make a perfect square</li>
    </ul>
    <p class="big">${nw(`${X2} + ${V("b")}${X1} + ${V("c")}`)} = ${nw(`(${X1} + ${frac(V("b"),"2")})²`)} − ${nw(`(${frac(V("b"),"2")})²`)} + ${V("c")}</p>
    <table>
      <tr><th>Example</th><th>Working</th></tr>
      <tr><td>${nw(`${X2} + 8${X1} + 5`)}</td><td>${nw(`= ${X2} + 8${X1} + 16 − 16 + 5`)}<br>= <b>${nw(`(${X1} + 4)² − 11`)}</b></td></tr>
      <tr><td>${nw(`${X2} − 5${X1} + 2`)}</td><td>${nw(`= (${X1} − ${frac("5","2")})² − ${frac("25","4")} + 2`)}<br>= <b>${nw(`(${X1} − ${frac("5","2")})² − ${frac("17","4")}`)}</b></td></tr>
    </table>
    <p class="anno">* the sign in the bracket follows ${V("b")}; the (${frac(V("b"),"2")})² is always taken away</p>
  </div>

  <div class="panelc"><h4>Picture it</h4>
    <a href="#complete-square?b=8&c=0&mv=1" class="piclink"><svg viewBox="0 -10 220 114" style="width:100%;max-width:340px;display:block;margin:0 auto">
      <g font-size="12" font-style="italic" text-anchor="middle" fill="var(--ink)"><text x="58" y="3">x</text><text x="98" y="3">4</text><text x="22" y="40">x</text><text x="22" y="80">4</text></g>
      <rect x="30" y="8" width="56" height="56" fill="var(--blue-fill)" stroke="var(--ink)"/>

      <rect x="30" y="64" width="56" height="24" fill="var(--amber-fill)" stroke="var(--ink)"/>
      <rect x="86" y="64" width="24" height="24" fill="var(--red-fill)" stroke="var(--red)" stroke-dasharray="4 2"/>
      <g font-style="italic" font-weight="700" text-anchor="middle" font-size="13">
        <text x="58" y="41" fill="var(--blue)">x²</text><text x="98" y="41" fill="var(--amber)">4x</text>
        <text x="58" y="81" fill="var(--amber)">4x</text><text x="98" y="81" fill="var(--red)">16</text></g>
      <text x="124" y="72" font-size="12" fill="var(--red)">← missing</text>
      <text x="124" y="87" font-size="12" fill="var(--red)">(8 ÷ 2)² = 16</text>
      <text x="124" y="30" font-size="12" fill="var(--blue)">x² + 8x + 16</text>
      <text x="124" y="45" font-size="12" fill="var(--blue)">= (x + 4)²</text>
    </svg></a>
    ${PLAYLINK("#complete-square","Interactive: cut and move the strip")}
  </div>

  <div class="panelc"><h4>Number in front of x² <span class="badge">A-Math</span></h4>
    <ul class="steps">
      <li>2${X2} − 12${X1} + 7</li>
      <li>${nw(`= 2(${X2} − 6${X1}) + 7`)} <span class="tagop">take 2 out of the ${X2} and ${X1} terms only</span></li>
      <li>${nw(`= 2[(${X1} − 3)² − 9] + 7`)}</li>
      <li>${nw(`= 2(${X1} − 3)² − 18 + 7`)} <span class="tagop">× 2 into the [ ]</span></li>
      <li>= <b>2(${X1} − 3)² − 11</b></li>
    </ul>
    <div class="wrongright">
      <div class="x">✗ 2(${X1} − 3)² − 9 + 7</div>
      <div class="ok">✓ 2(${X1} − 3)² − 18 + 7</div>
    </div>
    <div class="note"><b>Note!</b> When you open the square bracket, the −9 gets multiplied by 2 too.</div>
    <p class="anno">* E-Math only tests ${X2} + ${V("p")}${X1} + ${V("q")} (no number in front of ${X2}).</p>
  </div>

  <div class="panelc"><h4>What you can read off</h4>
    <table>
      <tr><th>${nw(`${V("y")} =`)} ${nw(`${V("a")}(${X1} − ${V("h")})² + ${V("k")}`)}</th><th>${V("a")} &gt; 0</th><th>${V("a")} &lt; 0</th></tr>
      <tr><td>Turning point</td><td colspan="2">(${V("h")}, ${V("k")})</td></tr>
      <tr><td>Type</td><td>${nw("minimum ∪")}</td><td>${nw("maximum ∩")}</td></tr>
      <tr><td>Min / max value of ${V("y")}</td><td colspan="2">${V("k")}, when ${X1} = ${V("h")}</td></tr>

quadGraphs:`${MUST([FB("blue","Turning point form",nw(`${V("y")} = ${V("a")}(${X1} − ${V("h")})² + ${V("k")}`),`turning point (${V("h")}, ${V("k")})`),FB("red","Factorised form",nw(`${V("y")} = ${V("a")}(${X1} − ${V("p")})(${X1} − ${V("q")})`),`cuts the ${X1}-axis at ${V("p")} and ${V("q")}`),FB("amber","Expanded form",nw(`${V("y")} = ${V("a")}${X2} + ${V("b")}${X1} + ${V("c")}`),`cuts the ${V("y")}-axis at ${V("c")}`)])}
<div class="sheet">

      <tr><th>Form</th><th>Example → what it shows</th></tr>
      <tr><td>${nw(`${V("y")} = ${V("a")}(${X1} − ${V("h")})² + ${V("k")}`)}</td><td class="exs">${nw(`${V("y")} = (${X1} − 1)² − 4`)}${miniQF("tp")}<span class="cap">turning point (1, −4)</span></td></tr>
      <tr><td>${nw(`${V("y")} = ${V("a")}(${X1} − ${V("p")})(${X1} − ${V("q")})`)}</td><td class="exs">${nw(`${V("y")} = (${X1} + 1)(${X1} − 3)`)}${miniQF("roots")}<span class="cap">cuts ${X1}-axis at −1, 3</span></td></tr>
      <tr><td>${nw(`${V("y")} = ${V("a")}${X2} + ${V("b")}${X1} + ${V("c")}`)}</td><td class="exs">${nw(`${V("y")} = ${X2} − 2${X1} − 3`)}${miniQF("yint")}<span class="cap">cuts ${V("y")}-axis at −3</span></td></tr>

discrim:`${MUST([FB("green",`${V("b")}² − 4${V("ac")} &gt; 0`,"2 real, different roots","line CUTS the curve twice"),FB("amber",`${V("b")}² − 4${V("ac")} = 0`,"2 real, equal roots","line TOUCHES: a tangent"),FB("red",`${V("b")}² − 4${V("ac")} &lt; 0`,"no real roots","line MISSES the curve")])}
<div class="sheet">
  <div class="panelc"><h4>b² − 4ac and the roots of ax² + bx + c = 0</h4>
    <table>
      <tr><th>${V("b")}² − 4${V("ac")}</th><th>Roots</th><th>Graph</th></tr>
      <tr><td>&gt; 0</td><td>2 real, different roots</td><td>${miniQ(2)}</td></tr>
      <tr><td>= 0</td><td>2 real, equal roots</td><td>${miniQ(1)}</td></tr>
      <tr><td>&lt; 0</td><td>no real roots</td><td>${miniQ(0)}</td></tr>
    </table>
    <p class="anno">* "real roots" (any, equal or not) → ${V("b")}² − 4${V("ac")} ≥ 0</p>
  </div>

  <div class="panelc"><h4>Line and curve</h4>
    <ul class="steps">
      <li>① Substitute the line into the curve</li>
      <li>② Rearrange to (quadratic) = 0</li>
      <li>③ Use ${V("b")}² − 4${V("ac")} of <b>that</b> quadratic</li>
    </ul>
    <div class="piccards">
      ${PIC("#discriminant?m=1&c=3",miniLC(2),`cuts at 2 points`,`${V("b")}² − 4${V("ac")} &gt; 0`)}
      ${PIC("#discriminant?m=0&c=1",miniLC(1),`touches: a tangent`,`${V("b")}² − 4${V("ac")} = 0`)}
      ${PIC("#discriminant?m=0&c=-1",miniLC(0),`does not meet`,`${V("b")}² − 4${V("ac")} &lt; 0`)}
    </div>
    <p class="anno">* "meets / intersects" (any number of points) → ${V("b")}² − 4${V("ac")} ≥ 0</p>
  </div>

  <div class="panelc"><h4>Example: tangent</h4>
    <p>${V("y")} = ${X1} + ${V("k")} is a tangent to ${V("y")} = ${X2} − 3${X1} + 5. Find ${V("k")}.</p>
    <ul class="steps">
      <li>${X2} − 3${X1} + 5 = ${X1} + ${V("k")}</li>
      <li>${X2} − 4${X1} + (5 − ${V("k")}) = 0 <span class="tagop">a = 1, b = −4, c = 5 − k</span></li>
      <li>(−4)² − 4(1)(5 − ${V("k")}) = 0 <span class="tagop">tangent → = 0</span></li>
      <li>16 − 20 + 4${V("k")} = 0 → <b>${V("k")} = 1</b></li>
    </ul>
  </div>

  <div class="panelc"><h4>Always positive / always negative</h4>

      <tr><td>always positive (for all ${X1})</td><td>${nw(`${V("a")} &gt; 0`)} <b>and</b> ${nw(`${V("b")}² − 4${V("ac")} &lt; 0`)}</td></tr>
      <tr><td>always negative (for all ${X1})</td><td>${nw(`${V("a")} &lt; 0`)} <b>and</b> ${nw(`${V("b")}² − 4${V("ac")} &lt; 0`)}</td></tr>
    </table>
  </div>

  <div class="panelc"><h4>Common mistakes</h4>
    <div class="wrongright">
      <div class="x">✗ using the line's ${V("c")} in ${V("b")}² − 4${V("ac")}</div>
      <div class="ok">✓ rearrange to … = 0 first<br>then read ${V("a")}, ${V("b")}, ${V("c")}</div>
    </div>
    <div class="note"><b>Note!</b> In the example above, ${nw(`${V("c")} = 5 − ${V("k")}`)}, not ${V("k")} and not 5.</div>
    <div class="note"><b>Note!</b> If ${V("k")} is in front of ${X2}, you also need ${nw(`${V("a")} ≠ 0`)} for it to be a quadratic (and ${nw(`${V("a")} &gt; 0`)} or ${nw(`${V("a")} &lt; 0`)} for always positive / negative).</div>
  </div>
</div>`,

trigAngles:`${MUST([FB("red",`Basic angle ${AL}`,`${AL} = sin⁻¹, cos⁻¹ or tan⁻¹ of the POSITIVE value`,"always acute: cos⁻¹ 0.5 = 60°, even for cos θ = −0.5"),FB("blue","ASTC = which ratios are +",`A S T C`,"All, Sin, Tan, Cos: anticlockwise from Q1"),FB("green",`θ from ${AL}`,`Q1: ${AL}<br>Q2: ${nw(`180° − ${AL}`)}<br>Q3: ${nw(`180° + ${AL}`)}<br>Q4: ${nw(`360° − ${AL}`)}`,"same triangle in every quadrant")])}

  </div>

    <table>

rFormula:`${MUST([FB("blue",`${CV("blue","R")} = √(${V("a")}² + ${V("b")}²)`,"the hypotenuse","the wave goes up to R and down to −R"),FB("red",`tan ${AL} = ${frac(V("b"),V("a"))}`,`${AL} acute`,"b over a, not a over b"),FB("amber","Max and min",`${V("R")} and −${V("R")}`,"sin and cos are never beyond ±1")])}
<div class="sheet">
  <div class="panelc"><h4>The 4 forms <span class="badge">memorise: not on the formula sheet</span></h4>
    <table>
      <tr><th>Expression</th><th>R-form</th></tr>
      <tr><td>${nw(`${V("a")} sin θ + ${V("b")} cos θ`)}</td><td>${nw(`${V("R")} sin(θ + α)`)}</td></tr>
      <tr><td>${nw(`${V("a")} sin θ − ${V("b")} cos θ`)}</td><td>${nw(`${V("R")} sin(θ − α)`)}</td></tr>

      <tr><td>${nw(`${V("a")} cos θ − ${V("b")} sin θ`)}</td><td>${nw(`${V("R")} cos(θ + α)`)}</td></tr>
    </table>
    <p class="big">${nw(`${V("R")} = √(${V("a")}² + ${V("b")}²)`)} &nbsp;·&nbsp; ${nw(`tan ${AL} = ${frac(V("b"),V("a"))}`)}</p>
    <p class="anno">* ${V("a")}, ${V("b")} &gt; 0 and ${AL} acute. ${V("a")} = the number in front of the ratio named in the R-form.</p>
  </div>

  <div class="panelc"><h4>Where R and α come from</h4>
    <a href="#r-formula?mode=cos&a=3&b=4" class="piclink"><svg viewBox="0 0 220 98" style="width:100%;max-width:300px;display:block;margin:0 auto">
      <path d="M20 78 L110 78 L110 18 Z" fill="var(--blue-fill)" stroke="var(--ink)" stroke-width="1.2"/>

    </svg></a>
    ${rWhy("cos",V("a"),V("b"))}

  </div>

  <div class="panelc"><h4>Max and min</h4>
    <ul class="steps">
      <li>3 cos θ + 4 sin θ = 5 cos(θ − 53.13°)</li>

      <li>Min = <b>−5</b> when θ − 53.13° = 180° → θ = 233.1°</li>

  </div>

  <div class="panelc"><h4>Solve, step by step</h4>
    <p>3 cos θ + 4 sin θ = 2.5, for 0° ≤ θ ≤ 360°</p>
    <ul class="steps">
      <li>① 5 cos(θ − 53.13°) = 2.5</li>
      <li>② cos(θ − 53.13°) = 0.5 <span class="tagop">÷ 5</span></li>
      <li>③ Range: ${nw("−53.13° ≤ θ − 53.13°")} ${nw("≤ 306.87°")} <span class="tagop">− 53.13° all round</span></li>
      <li>④ θ − 53.13° = 60° or 300° <span class="anno">(−60° is outside the range, so reject it)</span></li>
      <li>⑤ θ = <b>113.1°</b> or <b>353.1°</b></li>

  </div>

  <div class="panelc"><h4>Common mistakes</h4>
    <div class="wrongright">
      <div class="x">✗ tan α = ${frac(V("a"),V("b"))}</div>
      <div class="ok">✓ tan α = ${frac(V("b"),V("a"))}</div>
    </div>
    <div class="note"><b>Note!</b> Keep α to 2 d.p. while working; give final angles to 1 d.p. Always shift the range in step ③ before solving.</div>
  </div>
</div>`,

diffApps:`${MUST([FB("blue",`${frac("d"+V("y"),"d"+V("x"))} = gradient of the tangent`,nw(`${V("y")} − ${V("y")}₁ = ${V("m")}(${X1} − ${X1}₁)`),`normal: gradient ${nw("−1 ÷ m")}`),FB("amber","Stationary point",`${frac("d"+V("y"),"d"+V("x"))} = 0`,"flat tangent · find x AND y"),FB("green","Max or min?",`${frac("d²"+V("y"),"d"+V("x")+"²")} &lt; 0 max ∩ · &gt; 0 min ∪`,"= 0 → use the sign test")])}
<div class="sheet">
  <div class="panelc"><h4>Tangent and normal</h4>
    <a href="#tangent-gradient?cv=cubic&x=-1.5&nm=nor" class="piclink"><svg viewBox="0 0 200 80" style="width:100%;max-width:260px;display:block;margin:0 auto">
      <path d="M20 75 Q70 -10 180 20" fill="none" stroke="var(--blue)" stroke-width="2"/>
      <line x1="19.3" y1="61.2" x2="91.5" y2="7.5" stroke="var(--green)" stroke-width="1.6"/>
      <line x1="34.5" y1="6.3" x2="76.3" y2="62.5" stroke="var(--amber)" stroke-width="1.6"/>
      <circle cx="55.4" cy="34.4" r="3" fill="var(--ink)"/>
      <text x="94" y="12" font-size="12" fill="var(--green)">tangent</text><text x="80" y="66" font-size="12" fill="var(--amber)">normal</text>
    </svg></a>
    <ul class="steps">
      <li>Gradient of tangent ${V("m")} = ${frac("d"+V("y"),"d"+V("x"))} at that point</li>
      <li>Gradient of normal = −${frac("1",V("m"))} <span class="tagop">normal ⊥ tangent</span></li>
      <li>Equation: <span class="nw">${V("y")} − ${V("y")}₁ = ${V("m")}(${X1} − ${X1}₁)</span></li>
    </ul>
    <p class="anno">* if ${V("m")} = 0: · tangent ${nw(`${V("y")} = ${V("y")}₁`)} (flat) · normal ${nw(`${X1} = ${X1}₁`)} (vertical)</p>
    ${EG(`e.g. ${V("y")} = ${X2} at (1, 1)`,[`${nw(`${V("m")} = 2(1) = 2`)}`,`tangent: ${nw(`${V("y")} = 2${X1} − 1`)}`,`normal gradient: ${nw(`−${frac("1","2")}`)}`,`normal: ${nw(`${V("y")} = −${frac("1","2")}${X1} + ${frac("3","2")}`)}`])}
    ${PLAYLINK("#tangent-gradient","Interactive: slide the tangent")}
  </div>

  <div class="panelc"><h4>Increasing, decreasing, stationary</h4>
    <table>
      <tr><th>${frac("d"+V("y"),"d"+V("x"))}</th><th>Meaning</th></tr>
      <tr><td>&gt; 0</td><td><span class="k-green">increasing ↗</span></td></tr>
      <tr><td>&lt; 0</td><td><span class="k-red">decreasing ↘</span></td></tr>
      <tr><td>= 0</td><td><span class="k-amber">stationary point</span> (find both ${X1} and ${V("y")})</td></tr>
    </table>
    ${EG(`"Show ${V("y")} = ${V("x")}³ + 3${X1} is increasing for all ${X1}"`,[`${nw(`${frac("d"+V("y"),"d"+V("x"))} = 3${X2} + 3`)}`,`${nw(`${X2} ≥ 0`)}, so ${nw(`3${X2} + 3 ≥ 3 &gt; 0`)} ✓`])}
    ${EG(`"Range of ${X1} for which ${V("y")} is increasing"`,[`solve ${nw(`${frac("d"+V("y"),"d"+V("x"))} &gt; 0`)}`])}
  </div>

  <div class="panelc"><h4>Max, min or inflexion?</h4>
    <div class="piccards">
      ${PIC("#tangent-gradient?cv=cubic&x=-1",shapeIcon("max","var(--amber)",72),"Maximum",`${frac("d²"+V("y"),"d"+V("x")+"²")} &lt; 0 · signs + 0 −`)}
      ${PIC("#tangent-gradient?cv=cubic&x=1",shapeIcon("min","var(--amber)",72),"Minimum",`${frac("d²"+V("y"),"d"+V("x")+"²")} &gt; 0 · signs − 0 +`)}
      ${PIC("#tangent-gradient?cv=cube&x=0",shapeIcon("infUp","var(--amber)",72),"Inflexion",`signs ${nw("+ 0 +")} · or ${nw("− 0 −")}`)}
    </div>
    <p class="anno">* ${frac("d²"+V("y"),"d"+V("x")+"²")} = 0 → this test can't tell. Use the sign test (it could be max, min or inflexion).</p>
    <ul class="steps">
      <li>${nw(`${V("y")} = ${V("x")}³ − 3${X1} + 1`)}</li>
      <li>${nw(`${frac("d"+V("y"),"d"+V("x"))} = 3${X2} − 3 = 0`)} <span class="nw">→ ${X1} = ±1</span></li>
      <li>${nw(`${frac("d²"+V("y"),"d"+V("x")+"²")} = 6${X1}`)}</li>
      <li>${nw(`${X1} = 1: 6 &gt; 0`)} → <b>min (1, −1)</b></li>
      <li>${nw(`${X1} = −1: −6 &lt; 0`)} → <b>max (−1, 3)</b></li>
    </ul>
  </div>

  <div class="panelc"><h4>Connected rates</h4>
    <p class="big">${frac("d"+V("A"),"d"+V("t"))} = ${frac("d"+V("A"),"d"+V("r"))} × ${frac("d"+V("r"),"d"+V("t"))}</p>
    ${EG(`e.g. circle: radius grows at 0.5 cm/s. Rate of area when ${V("r")} = 4?`,[`${nw(`${V("A")} = π${V("r")}²`)} → ${nw(`${frac("d"+V("A"),"d"+V("r"))} = 2π${V("r")}`)}`,`${nw(`${frac("d"+V("A"),"d"+V("t"))} = 2π(4) × 0.5`)}`,`${nw(`= <b>4π cm²/s</b>`)}`])}
  </div>

  <div class="panelc"><h4>Max / min word problems</h4>
    <ul class="steps">
      <li>① Write the quantity in <b>one</b> variable</li>
      <li>② Differentiate, put = 0, solve</li>
      <li>③ Check max or min with ${frac("d²"+V("y"),"d"+V("x")+"²")}</li>
      <li>④ Answer the question asked (often the max value, not ${X1})</li>
    </ul>
    <div class="note"><b>Note!</b> ${frac("d²"+V("y"),"d"+V("x")+"²")} = 0 does <b>not</b> mean inflexion. Check the sign of ${frac("d"+V("y"),"d"+V("x"))} on both sides.</div>
    <p class="anno">* the differentiation rules themselves: see <a href="#sheet/differentiation-rules">Differentiation rules</a></p>
  </div>
</div>`,

speedTime:`${MUST([FB("green","Gradient of speed–time graph","= acceleration","m/s² · flat = steady speed · downhill = slowing down"),FB("blue","Area under speed–time graph","= distance travelled","triangle · rectangle · trapezium"),FB("amber","km/h ↔ m/s","÷ 3.6 → m/s · × 3.6 → km/h","72 km/h = 20 m/s")])}
<div class="sheet">
  <div class="panelc"><h4>Speed–time graph</h4>
    <a href="#speed-time" class="piclink"><svg viewBox="0 0 220 100" style="width:100%;max-width:320px;display:block;margin:0 auto">
      <path d="M20 85 L70 25 L140 25 L200 85 Z" fill="var(--blue-fill)"/>
      <path d="M20 85 L70 25 L140 25 L200 85" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
      <line x1="15" y1="85" x2="212" y2="85" stroke="var(--ink)"/><line x1="20" y1="90" x2="20" y2="10" stroke="var(--ink)"/>
      <text x="45" y="48" font-size="11" fill="var(--green)" font-weight="700" transform="rotate(-50 45 48)">speeding up</text>
      <text x="105" y="20" font-size="11" fill="var(--ink)" text-anchor="middle">steady</text>
      <text x="168" y="44" font-size="11" fill="var(--red)" font-weight="700" transform="rotate(50 168 44)">slowing down</text>
      <text x="105" y="62" font-size="12" fill="var(--blue)" text-anchor="middle" font-weight="700">area = distance</text>
      <text x="206" y="97" font-size="10" fill="var(--muted)">t (s)</text><text x="4" y="14" font-size="10" fill="var(--muted)">v</text>
    </svg></a>
    <table>
      <tr><th>Part of the graph</th><th>Means</th></tr>
      <tr><td>sloping up</td><td>speeding up: acceleration = gradient = ${frac("change in speed","time")}</td></tr>
      <tr><td>flat</td><td>steady speed, acceleration 0</td></tr>
      <tr><td>sloping down</td><td>slowing down (deceleration): gradient is negative</td></tr>
      <tr><td>on the ${V("t")}-axis</td><td>stopped (speed 0)</td></tr>
    </table>
    ${PLAYLINK("#speed-time","Interactive: drag the corners")}
  </div>

  <div class="panelc"><h4>Distance = area under the graph</h4>
    <ul class="steps">
      <li>Triangle: ${frac("1","2")} × base × height</li>
      <li>Rectangle: base × height</li>
      <li>Trapezium:<br>${nw(`${frac("1","2")} × (sum of parallel sides) × width`)}</li>
    </ul>
    <p class="anno">* split the area at every corner, find each piece, add them up</p>
    <p class="anno">* average speed = ${frac("total distance","total time")} (NOT the average of the speeds)</p>
  </div>

  <div class="panelc"><h4>Distance–time graph (the other one)</h4>
    <table>
      <tr><th>Part of the graph</th><th>Means</th></tr>
      <tr><td>gradient</td><td><b>speed</b> = ${frac("distance","time")}</td></tr>
      <tr><td>flat</td><td>not moving</td></tr>
      <tr><td>steeper</td><td>faster</td></tr>
      <tr><td>curve getting steeper</td><td>speeding up</td></tr>
    </table>
    <div class="note"><b>Note!</b> Area under a distance–time graph means nothing. Area is only for the speed–time graph.</div>
  </div>

  <div class="panelc"><h4>Units: km/h ↔ m/s</h4>
    <ul class="steps">
      <li>1 km/h = ${frac("1000 m","3600 s")} = ${frac("5","18")} m/s</li>
      <li>km/h → m/s: <b>÷ 3.6</b> &nbsp; (72 km/h = 20 m/s)</li>
      <li>m/s → km/h: <b>× 3.6</b> &nbsp; (15 m/s = 54 km/h)</li>
    </ul>
    <p class="anno">* acceleration in m/s² needs speed in m/s and time in s. Convert first.</p>
  </div>

  <div class="panelc"><h4>Example</h4>
    <p>A car speeds up from rest to 12 m/s in 4 s, keeps 12 m/s for 6 s, then slows to a stop in 4 s.</p>
    <ul class="steps">
      <li>Acceleration in the first 4 s = ${frac("12 − 0","4")} = <b>3 m/s²</b></li>
      <li>Distance = ${nw(`${frac("1","2")} × 4 × 12 + 6 × 12 + ${frac("1","2")} × 4 × 12`)}<br>= ${nw("24 + 72 + 24")} = <b>120 m</b></li>
      <li>Average speed = ${frac("120","14")} = <b>8.57 m/s</b> (3 s.f.)</li>
    </ul>
  </div>

  <div class="panelc"><h4>Common mistakes</h4>
    <div class="wrongright">
      <div class="x">✗ slowing down 3 m/s²<br>written as "acceleration 3 m/s²"</div>
      <div class="ok">✓ acceleration = −3 m/s²<br>or "deceleration 3 m/s²"</div>
      <div class="x">✗ average speed = (0 + 12 + 0) ÷ 3</div>
      <div class="ok">✓ average speed = ${frac("total distance","total time")}</div>
    </div>
  </div>
</div>`,

kinematics:`${MUST([FB("blue",`Differentiate ${V("s")} → ${V("v")} → ${V("a")}`,`${nw(`${V("v")} = ${frac("d"+V("s"),"d"+V("t"))}`)} · ${nw(`${V("a")} = ${frac("d"+V("v"),"d"+V("t"))}`)}`,`integrate to go back: ${V("a")} → ${V("v")} → ${V("s")}`),FB("amber","At rest / turns round",`${V("v")} = 0`,"max displacement is where v = 0"),FB("red","Distance ≠ displacement","split the journey where v = 0","add the parts as positive numbers")])}
<div class="sheet">
  <div class="panelc"><h4>s, v, a</h4>
    <table>
      <tr><th>Quantity</th><th>Symbol</th><th>How to get it</th></tr>
      <tr><td>displacement (position from O)</td><td>${V("s")}</td><td>${V("s")} = ∫ ${V("v")} d${V("t")}</td></tr>
      <tr><td>velocity</td><td>${V("v")}</td><td><span class="nw">${V("v")} = ${frac("d"+V("s"),"d"+V("t"))}</span> <span class="nw">= ∫ ${V("a")} d${V("t")}</span></td></tr>
      <tr><td>acceleration</td><td>${V("a")}</td><td>${V("a")} = ${frac("d"+V("v"),"d"+V("t"))}</td></tr>
    </table>
    <p class="anno">* integrating gives + ${V("c")}: find ${V("c")} from "starts at O" (${V("s")} = 0 at ${V("t")} = 0) or "initial velocity"</p>
    ${PLAYLINK("#area-under","Interactive: watch the particle move")}
  </div>

  <div class="panelc"><h4>Exam phrases → what to do</h4>
    <table>
      <tr><th>The question says</th><th>Do</th></tr>
      <tr><td>at rest / momentarily at rest / changes direction</td><td>put ${V("v")} = 0</td></tr>
      <tr><td>maximum or minimum displacement</td><td>${V("v")} = 0, then find ${V("s")}</td></tr>
      <tr><td>maximum or minimum velocity</td><td>${V("a")} = 0, then find ${V("v")}</td></tr>
      <tr><td>returns to O / passes through O</td><td>put ${V("s")} = 0</td></tr>
      <tr><td>initial velocity</td><td>put ${V("t")} = 0 in ${V("v")}</td></tr>
      <tr><td>constant velocity</td><td>${V("a")} = 0</td></tr>
    </table>
  </div>

  <div class="panelc"><h4>Distance travelled vs displacement</h4>
    <a href="#area-under?cv=lin&T=5" class="piclink"><svg viewBox="0 0 220 70" style="width:100%;max-width:300px;display:block;margin:0 auto">
      <path d="M20 10 L110 45 L110 45 Z" fill="var(--blue-fill)"/><path d="M20 10 L110 45 L20 45 Z" fill="var(--blue-fill)"/>
      <path d="M110 45 L170 68 L170 45 Z" fill="var(--red-fill)"/>
      <line x1="10" y1="45" x2="210" y2="45" stroke="var(--ink)"/><line x1="20" y1="10" x2="170" y2="68" stroke="var(--blue)" stroke-width="2.5"/>
      <text x="55" y="38" font-size="12" fill="var(--blue)" font-weight="700">+9</text><text x="150" y="62" font-size="12" fill="var(--red)" font-weight="700">−4</text>
      <text x="105" y="58" font-size="10" fill="var(--muted)">t = 3</text><text x="200" y="40" font-size="10" fill="var(--muted)">t</text>
    </svg></a>
    <ul class="steps">
      <li>${V("v")} = 6 − 2${V("t")}: at rest when ${V("t")} = 3</li>
      <li>0 to 3 s: moves <b>+9 m</b> · 3 to 5 s: moves <b>−4 m</b> (backwards)</li>
      <li>Displacement at ${V("t")} = 5: 9 − 4 = <b>5 m</b> · Distance travelled: 9 + 4 = <b>13 m</b></li>
    </ul>
    <div class="note"><b>Note!</b> Never integrate straight from 0 to 5 for distance: the backwards part cancels. Split at ${V("v")} = 0.</div>
  </div>

  <div class="panelc"><h4>Speeding up or slowing down?</h4>
    <table>
      <tr><th>${V("v")} and ${V("a")}</th><th>Particle is…</th></tr>
      <tr><td>same sign</td><td>speeding up</td></tr>
      <tr><td>opposite signs</td><td>slowing down</td></tr>
      <tr><td>${V("a")} = 0</td><td>constant velocity (not "stopped")</td></tr>
    </table>
    <p class="anno">* ${V("a")} &lt; 0 does NOT always mean slowing down: if ${V("v")} is also negative, it is speeding up (backwards)</p>
  </div>

  <div class="panelc"><h4>Worked example</h4>
    <p>${V("v")} = ${V("t")}² − 4${V("t")} + 3, starts at O. Find the distance travelled in the first 3 s.</p>
    <ul class="steps">
      <li>① ${V("v")} = 0 → (${V("t")} − 1)(${V("t")} − 3) = 0 → ${V("t")} = 1 or 3</li>
      <li>② ${V("s")} = ${frac(V("t")+"³","3")} − 2${V("t")}² + 3${V("t")} <span class="tagop">c = 0, starts at O</span></li>
      <li>③ ${V("s")}(1) = ${frac("4","3")} · ${V("s")}(3) = 0</li>
      <li>④ Distance = ${frac("4","3")} + |0 − ${frac("4","3")}| = <b>${frac("8","3")} m</b> <span class="anno">(displacement is 0)</span></li>
    </ul>
  </div>
</div>`,

integration:`${MUST([FB("blue","Power rule",`∫ ${X1}<sup>${V("n")}</sup> d${X1} = ${frac(X1+"<sup>"+V("n")+" + 1</sup>",V("n")+" + 1")} + ${V("c")}`,"add 1 to the power, divide by the new power"),FB("amber","Definite integral",`${nw(`∫<span class="lim"><sup>${V("b")}</sup><sub>${V("a")}</sub></span> f(${X1}) d${X1}`)} = ${nw(`F(${V("b")}) − F(${V("a")})`)}`,"upper − lower, no + c"),FB("red","Area below the axis","integral comes out negative","area = its positive value · split at crossings")])}
<div class="sheet">
  <div class="panelc"><h4>Why area under a graph = integral</h4>
    <ul class="steps">
      <li>Area under a speed–time graph = distance travelled</li>
      <li>Differentiate distance → speed: ${frac("d"+V("s"),"d"+V("t"))} = ${V("v")}</li>
      <li>Integrate speed → distance: ${V("s")} = ∫ ${V("v")} d${V("t")}</li>
    </ul>
    <p class="anno">* below the axis (moving backwards) the area counts as negative. <a href="#area-under">Open the Kinematics aid</a></p>
  </div>
  <div class="panelc"><h4>Rules <span class="badge">memorise: not on the formula sheet</span></h4>
    <table>
      <tr><th>∫ … d${X1}</th><th>Answer (+ ${V("c")})</th></tr>
      <tr><td>${X1}<sup>${V("n")}</sup> (${V("n")} ≠ −1)</td><td>${frac(X1+"<sup>"+V("n")+" + 1</sup>",V("n")+" + 1")}</td></tr>
      <tr><td>(${V("a")}${X1} + ${V("b")})<sup>${V("n")}</sup> (${V("n")} ≠ −1)</td><td>${frac("("+V("a")+X1+" + "+V("b")+")<sup>"+V("n")+" + 1</sup>",V("a")+"("+V("n")+" + 1)")}</td></tr>
      <tr><td>sin ${X1}</td><td>−cos ${X1}</td></tr>
      <tr><td>cos ${X1}</td><td>sin ${X1}</td></tr>
      <tr><td>sec² ${X1}</td><td>tan ${X1}</td></tr>
      <tr><td>sin(${V("a")}${X1} + ${V("b")})</td><td>−${frac("1",V("a"))} cos(${V("a")}${X1} + ${V("b")})</td></tr>

indices:`${MUST([FB("blue","Same base: work on the powers",`${nw(`${V("a")}<sup>${V("m")}</sup> × ${V("a")}<sup>${V("n")}</sup> = ${V("a")}<sup>${V("m")} + ${V("n")}</sup>`)}<br>${nw(`${V("a")}<sup>${V("m")}</sup> ÷ ${V("a")}<sup>${V("n")}</sup> = ${V("a")}<sup>${V("m")} − ${V("n")}</sup>`)}<br>${nw(`(${V("a")}<sup>${V("m")}</sup>)<sup>${V("n")}</sup> = ${V("a")}<sup>${V("mn")}</sup>`)}`,"memorise"),FB("amber","Zero and negative",`${nw(`${V("a")}<sup>0</sup> = 1`)} · ${nw(`${V("a")}<sup>−${V("n")}</sup> = ${frac("1",V("a")+"<sup>"+V("n")+"</sup>")}`)}`,"negative power = flip it (not a negative number)"),FB("green","Fraction power = root",`${nw(`${V("a")}<sup>${frac("1",V("n"))}</sup> = <sup>${V("n")}</sup>√${V("a")}`)} · ${nw(`${V("a")}<sup>${frac(V("m"),V("n"))}</sup> = (<sup>${V("n")}</sup>√${V("a")})<sup>${V("m")}</sup>`)}`,"denominator = root, numerator = power")])}
<div class="sheet">
  <div class="panelc"><h4>The laws, with numbers</h4>
    <table>
      <tr><th>Law</th><th>Example</th></tr>
      <tr><td>${nw(`${V("a")}<sup>${V("m")}</sup> × ${V("a")}<sup>${V("n")}</sup> = ${V("a")}<sup>${V("m")} + ${V("n")}</sup>`)}</td><td>${nw(`2³ × 2⁴ = 2⁷`)}</td></tr>
      <tr><td>${nw(`${V("a")}<sup>${V("m")}</sup> ÷ ${V("a")}<sup>${V("n")}</sup> = ${V("a")}<sup>${V("m")} − ${V("n")}</sup>`)}</td><td>${nw(`5⁶ ÷ 5² = 5⁴`)}</td></tr>
      <tr><td>${nw(`(${V("a")}<sup>${V("m")}</sup>)<sup>${V("n")}</sup> = ${V("a")}<sup>${V("mn")}</sup>`)}</td><td>${nw(`(3²)⁴ = 3⁸`)}</td></tr>
      <tr><td>${nw(`(${V("ab")})<sup>${V("n")}</sup> = ${V("a")}<sup>${V("n")}</sup>${V("b")}<sup>${V("n")}</sup>`)}</td><td>${nw(`(2${X1})³ = 8${V("x")}³`)}</td></tr>
      <tr><td>${nw(`(${frac(V("a"),V("b"))})<sup>${V("n")}</sup> = ${frac(V("a")+"<sup>"+V("n")+"</sup>",V("b")+"<sup>"+V("n")+"</sup>")}`)}</td><td>${nw(`(${frac("2","3")})² = ${frac("4","9")}`)}</td></tr>
    </table>
    <p class="anno">* different bases? You can't add the powers. · ${nw("2³ × 3² = 8 × 9 = 72")}</p>
  </div>

  <div class="panelc"><h4>Negative and fraction powers</h4>
    <table>
      <tr><th>Power</th><th>Means</th><th>Value</th></tr>
      <tr><td>2<sup>−3</sup></td><td>${frac("1","2³")}</td><td>${frac("1","8")}</td></tr>
      <tr><td>(${frac("2","3")})<sup>−2</sup></td><td>flip, then square: (${frac("3","2")})²</td><td>${frac("9","4")}</td></tr>
      <tr><td>8<sup>${frac("2","3")}</sup></td><td>(³√8)²</td><td>2² = 4</td></tr>
      <tr><td>27<sup>−${frac("1","3")}</sup></td><td>${frac("1","³√27")}</td><td>${frac("1","3")}</td></tr>
      <tr><td>16<sup>${frac("3","4")}</sup></td><td>(⁴√16)³</td><td>2³ = 8</td></tr>
    </table>
    <p class="anno">* root first (small numbers), then the power</p>
  </div>

  <div class="panelc"><h4>Equations: make the bases the same</h4>
    <ul class="steps">
      <li>${nw(`2<sup>${X1} + 1</sup> = 32`)}</li>
      <li>${nw(`2<sup>${X1} + 1</sup> = 2⁵`)} <span class="tagop">32 = 2⁵</span></li>
      <li>${nw(`${X1} + 1 = 5`)} → ${X1} = 4 <span class="tagop">same base → equate powers</span></li>
    </ul>
    <ul class="steps">
      <li>${nw(`3<sup>2${X1}</sup> = ${frac("1","27")}`)} = 3<sup>−3</sup> → 2${X1} = −3 → ${X1} = −${frac("3","2")}</li>
    </ul>
    ${FACTS("Know these: they make the bases the same",[["Base 2",["4 = 2²","8 = 2³","16 = 2⁴","32 = 2⁵"]],["Base 3",["9 = 3²","27 = 3³","81 = 3⁴"]],["Base 5",["25 = 5²","125 = 5³"]],["Any",["1 = anything⁰"]]])}
  </div>

  <div class="panelc"><h4>Simplify</h4>
    <ul class="steps">
      <li>${nw(`(2${V("a")}³${V("b")})² ÷ 4${V("a")}⁴${V("b")}<sup>−1</sup>`)}</li>
      <li>${nw(`= 4${V("a")}⁶${V("b")}² ÷ 4${V("a")}⁴${V("b")}<sup>−1</sup>`)} <span class="tagop">square everything inside</span></li>
      <li>${nw(`= ${V("a")}²${V("b")}³`)} <span class="tagop">4 ÷ 4 = 1 · ${V("a")}: 6 − 4 = 2 · ${V("b")}: 2 − (−1) = 3</span></li>
    </ul>
  </div>

  <div class="panelc"><h4>Common mistakes</h4>
    <div class="wrongright">
      <div class="x">✗ 2³ × 2⁴ = 4⁷</div>
      <div class="ok">✓ 2⁷ (base stays)</div>
      <div class="x">✗ (2${V("a")})³ = 2${V("a")}³</div>
      <div class="ok">✓ 8${V("a")}³</div>
      <div class="x">✗ ${V("a")}<sup>−2</sup> = −${V("a")}²</div>
      <div class="ok">✓ ${frac("1",V("a")+"²")}</div>
    </div>
    <div class="note"><b>Note!</b> A negative power never makes a positive number negative. It flips the fraction.</div>
  </div>
</div>`,

stdForm:`${MUST([FB("blue","Standard form",`${V("A")} × 10<sup>${V("n")}</sup>, with 1 ≤ ${V("A")} &lt; 10`,"one digit before the decimal point"),FB("amber","Big → + · small → −",`${nw(`345 000 = 3.45 × 10⁵`)} · ${nw(`0.00072 = 7.2 × 10<sup>−4</sup>`)}`,"count the jumps of the decimal point"),FB("green","Calculator",`use the ×10<sup>x</sup> key, not × 10 ^`,"answer to 3 s.f. unless told otherwise")])}

interest:`${MUST([FB("blue","Simple interest",`${V("I")} = ${frac(`${V("P")} × ${V("R")} × ${V("T")}`,"100")}`,"memorise · same amount every year"),FB("amber","Compound interest",`${V("A")} = ${V("P")}(1 + ${frac(V("r"),"100")})<sup>${V("n")}</sup>`,"on the formula sheet · interest = A − P"),FB("green","Not yearly?",`half-yearly: ${V("r")} ÷ 2, ${V("n")} × 2 · monthly: ${V("r")} ÷ 12, ${V("n")} × 12`,"r and n must match the period")])}

      <tr><th></th><th>Simple</th><th>Compound</th></tr>

sets:`${MUST([FB("blue","∩ = AND (the overlap)",`A ∩ B`,"in both A and B"),FB("amber","∪ = OR (everything in either)",`A ∪ B`,"in A, in B, or in both"),FB("red","′ = NOT (outside)",`A′`,"everything in ξ that is not in A")])}

    ${EG(`${nw(`{${X1} : ${X1} is a prime, ${X1} &lt; 10}`)}`,[`reads "the set of ${X1} such that…"`,`${nw("= {2, 3, 5, 7}")}`])}

function fitText(root,reset){ if(!root) return; if(reset) root._fit=null; const els=[...root.querySelectorAll(".formbox .eq, .khead")];
  const mem=(root._fit&&root._fit.length===els.length)?root._fit:(root._fit=new Array(els.length));
  els.forEach((el,i)=>{ el.style.fontSize=""; el.style.whiteSpace=""; const base=parseFloat(getComputedStyle(el).fontSize);
    let fs=(mem[i]&&mem[i]<base)?mem[i]:base; if(fs!==base) el.style.fontSize=fs+"px";
    const min=Math.max(12,base*.72);
    while(el.scrollWidth>el.clientWidth+1&&fs>min){ fs-=1; el.style.fontSize=fs+"px"; }
    if(el.scrollWidth>el.clientWidth+1) el.style.whiteSpace="normal";
    mem[i]=fs; });
  root.querySelectorAll(".formbox .rd, .formbox .hd").forEach(el=>{ el.style.fontSize=""; el.style.whiteSpace="nowrap";
    if(el.scrollWidth<=el.clientWidth+1){ el.style.whiteSpace=""; return; }
    const base=parseFloat(getComputedStyle(el).fontSize), need=el.scrollWidth/el.clientWidth;
    if(need>1.18){ el.style.whiteSpace=""; return; }
    let fs=base; const min=base*.85;
    while(el.scrollWidth>el.clientWidth+1&&fs>min){ fs-=.5; el.style.fontSize=fs+"px"; }
    if(el.scrollWidth>el.clientWidth+1){ el.style.whiteSpace=""; el.style.fontSize=""; } }); }
function settleKey(kb,reset){ if(!kb) return; const key=kb.closest(".key");

  if(cur.tab==="play"&&cur.state){ const p=new URLSearchParams(); Object.entries(cur.state()).forEach(([k,v])=>p.set(k,String(v))); const q=p.toString(); if(q) hsh+="?"+q; }
  return base+hsh;
}
backBtn.onclick=()=>{ location.hash=""; };
shareBtn.onclick=async()=>{
  const url=topicLink();
  try{
    if(matchMedia("(pointer:coarse)").matches&&navigator.share){ await navigator.share({title:document.title,url}); return; }
    await navigator.clipboard.writeText(url); toast("Link copied");
  }catch(e){ if(e&&e.name==="AbortError") return; try{ prompt("Copy this link:",url); }catch(_){} }
};
const qrModal=$("#qrModal"); let qrLib=null;
function loadQR(){ if(window.qrcode) return Promise.resolve(); if(!qrLib) qrLib=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"; s.onload=res; s.onerror=()=>{ qrLib=null; rej(); }; document.head.append(s); }); return qrLib; }
qrBtn.onclick=async()=>{
  const url=topicLink(); $("#qrTitle").textContent=cur&&cur.t?cur.t.title:cur&&cur.sheet?cur.sheet.title:cur&&cur.lessons?"Lessons with Coach Minyi":"Maths Hub"; $("#qrUrl").textContent=url; $("#qrBox").innerHTML=""; qrModal.hidden=false;
  try{ await loadQR(); const q=qrcode(0,"M"); q.addData(url); q.make(); $("#qrBox").innerHTML=q.createSvgTag(6,2); }
  catch(e){ $("#qrBox").innerHTML='<p class="hint">The QR code needs internet. Share the link instead.</p>'; }
};
$("#qrClose").onclick=()=>{ qrModal.hidden=true; };
qrModal.onclick=e=>{ if(e.target===qrModal) qrModal.hidden=true; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ qrModal.hidden=true; exitPresent(); } });
const exitBtn=$("#exitPresent");
function enterPresent(){
  document.documentElement.setAttribute("data-present","1");
  try{ const el=document.documentElement, f=el.requestFullscreen||el.webkitRequestFullscreen; const p=f&&f.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  fitSoon(); requestAnimationFrame(()=>settleKey(document.querySelector(".keybox"),true));
}
function exitPresent(){
  if(!document.documentElement.hasAttribute("data-present")) return;
  document.documentElement.removeAttribute("data-present");
  try{ if(document.fullscreenElement||document.webkitFullscreenElement){ const f=document.exitFullscreen||document.webkitExitFullscreen; const p=f&&f.call(document); if(p&&p.catch) p.catch(()=>{}); } }catch(e){}
  fitSoon(); requestAnimationFrame(()=>settleKey(document.querySelector(".keybox"),true));
}
presentBtn.onclick=enterPresent; exitBtn.onclick=exitPresent; printBtn.onclick=printSheet;
if("serviceWorker" in navigator&&location.protocol==="https:") addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
if(CF_TOKEN&&location.protocol==="https:"){ const s=document.createElement("script"); s.defer=true; s.src="https://static.cloudflareinsights.com/beacon.min.js"; s.setAttribute("data-cf-beacon",JSON.stringify({token:CF_TOKEN})); document.head.append(s); }
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement) exitPresent(); });
document.addEventListener("webkitfullscreenchange",()=>{ if(!document.webkitFullscreenElement) exitPresent(); });
zoomBtn.onclick=()=>{ if(!cur||!cur.stage) return; const big=cur.stage.classList.toggle("big"); const l=big?"Smaller diagram":"Bigger diagram"; zoomBtn.setAttribute("aria-label",l); zoomBtn.title=l; };
let footTaps=0, footT=0;
document.querySelector("footer").addEventListener("click",()=>{ const now=Date.now(); footTaps=(now-footT<900)?footTaps+1:1; footT=now;
  if(footTaps>=3){ footTaps=0; toast(`${innerWidth} × ${innerHeight} px · ×${(devicePixelRatio||1).toFixed(2)} · text ${getComputedStyle(document.body).fontSize}`); } });
const barEl=document.querySelector(".bar");
const setBarH=()=>document.documentElement.style.setProperty("--barh",Math.round(barEl.getBoundingClientRect().height)+"px");
if(window.ResizeObserver) new ResizeObserver(setBarH).observe(barEl); else addEventListener("resize",setBarH);

const themeBtn=$("#themeBtn");
const SUN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
const MOON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const isDark=()=>document.documentElement.getAttribute("data-theme")==="dark";
function paintThemeBtn(){
  const lbl=isDark()?"Switch to light mode":"Switch to dark mode";
  themeBtn.innerHTML=isDark()?SUN:MOON;
  themeBtn.setAttribute("aria-label",lbl); themeBtn.title=lbl;
}
themeBtn.onclick=()=>{

  hubTheme(t); try{localStorage.setItem("hubTheme",t)}catch(e){}
  paintThemeBtn();

const sysDark=matchMedia("(prefers-color-scheme: dark)");

if(sysDark.addEventListener) sysDark.addEventListener("change",followDevice); else if(sysDark.addListener) sysDark.addListener(followDevice);
let themeBeforePrint=null;
window.addEventListener("beforeprint",()=>{ themeBeforePrint=document.documentElement.getAttribute("data-theme"); hubTheme("light"); });
window.addEventListener("afterprint",()=>{ if(themeBeforePrint) hubTheme(themeBeforePrint); themeBeforePrint=null; });
paintThemeBtn();

const numOf=t=>parseFloat(String(t).replace(/−/g,"-").replace(/[^0-9.\-]/g,""));
function addNumBox(row){
  const r=$("input[type=range]",row), out=$("output",row); if(!r||!out||row._sync) return;
  const w=document.createElement("span"); w.className="numwrap";
  const b=document.createElement("input"); b.type="number"; b.className="numbox"; b.step="any";
  if(+r.min>=0) b.inputMode="decimal";
  b.setAttribute("aria-label",(r.getAttribute("aria-label")||$("label",row)?.textContent||"value")+" — type a number");
  const u=document.createElement("span"); u.className="unit";
  w.append(b,u); out.after(w); out.style.display="none";
  const shown=()=>numOf(out.textContent);
  row._sync=()=>{
    if(document.activeElement!==b){const v=shown(); const t=isNaN(v)?"":String(v); if(b.value!==t) b.value=t;}
    const un=((out.textContent.match(/([a-z°]+)\s*$/i)||[])[1])||""; if(u.textContent!==un) u.textContent=un;
    if(b.disabled!==r.disabled) b.disabled=r.disabled;
    if(row._stp) row._stp.forEach(x=>{ if(x.disabled!==r.disabled) x.disabled=r.disabled; });
  };
  const set=v=>{r.value=v; r.dispatchEvent(new Event("input",{bubbles:true}));};
  if((+r.max-+r.min)/(+r.step||1)<=200){
    const mk=(d,t)=>{ const bt=document.createElement("button"); bt.type="button"; bt.className="stp"; bt.textContent=t;
      bt.setAttribute("aria-label",(d<0?"Decrease ":"Increase ")+(r.getAttribute("aria-label")||"value"));
      bt.addEventListener("click",()=>{ const st=+r.step||1, dec=(String(st).split(".")[1]||"").length; const v=Math.min(+r.max,Math.max(+r.min,+r.value+d*st)); set(+v.toFixed(dec)); });
      return bt; };
    const mn=mk(-1,"−"), pl=mk(1,"+"); r.before(mn); out.after(pl); row._stp=[mn,pl];
  }
  const apply=()=>{
    const want=numOf(b.value); if(isNaN(want)){row._sync();return;}
    const lo=+r.min, hi=+r.max, st=+r.step||1;
    set(want);
    if(Math.abs(shown()-(+r.value))>1e-6){
      set(lo); const a=shown(); set(hi); const up=shown()>=a; let L=lo,H=hi;
      for(let i=0;i<40&&H-L>st;i++){const m=L+Math.max(1,Math.round((H-L)/2/st))*st; set(m); if((shown()<want)===up) L=m; else H=m;}
      set(L); const dL=Math.abs(shown()-want); set(H); if(dL<=Math.abs(shown()-want)) set(L);
    }
    const got=shown(); b.blur(); row._sync();
    if(Math.abs(got-want)>Math.max(st,1e-9)){b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),900);}
  };
  b.addEventListener("focus",()=>b.select());
  b.addEventListener("change",apply);
  b.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); b.blur();}});
  row._sync();
}
new MutationObserver(()=>document.querySelectorAll(".ctrl").forEach(row=>{addNumBox(row); row._sync&&row._sync();}))
  .observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["disabled"]});

let fitQ=0;
function fitStage(){fitQ=0; const left=document.querySelector(".left"), st=document.querySelector(".stage"), svg=st&&st.querySelector(":scope>svg"); if(!svg||!left) return;
  if(innerWidth<900){svg.style.maxHeight=""; return;}
  const top=left.getBoundingClientRect().top+scrollY, other=left.getBoundingClientRect().height-svg.getBoundingClientRect().height;
  const m=Math.max(240, Math.floor(innerHeight-12-top-other)); if(svg.style.maxHeight!==m+"px") svg.style.maxHeight=m+"px";}
const fitSoon=()=>{if(!fitQ) fitQ=requestAnimationFrame(fitStage)};
function placeDock(){
  const play=document.querySelector(".play"); if(!play) return;
  const dock=play.querySelector(".box.dock"), panel=play.querySelector(".panel"), slot=play.querySelector(".dockslot"); if(!dock||!panel) return;
  const docked=innerWidth<900&&innerHeight>=600;
  if(docked){ if(dock.parentElement!==play) play.append(dock); }
  else if(dock.parentElement!==panel){ if(slot) slot.after(dock); else panel.prepend(dock); }
}
addEventListener("resize",()=>{ placeDock(); fitSoon(); settleKey(document.querySelector(".keybox"),true); fitMust(); });
new MutationObserver(fitSoon).observe(document.body,{childList:true,subtree:true});
window.addEventListener("hashchange",route);
route();
fitSoon();
