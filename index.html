<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Hub">
<meta name="theme-color" content="#f7f5ef">
<title>Coach Minyi's Maths Hub</title>
<script>
/* Light / dark mode: the reader's saved choice (sun/moon button), else the device setting.
   Runs before the page paints so there is no flash of the wrong colours. */
function hubTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  var m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=t==="dark"?"#16171a":"#f7f5ef";
}
function hubSavedTheme(){ try{ var t=localStorage.getItem("hubTheme"); return t==="light"||t==="dark"?t:null }catch(e){ return null } }
hubTheme(hubSavedTheme()||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f7f5ef; --card:#ffffff; --ink:#1c1c1e; --muted:#6b6b70; --line:#dedad0;
  --grid:rgba(60,90,160,.09); --grid2:#cfd6e6;
  --blue:#2459c6; --blue-fill:#dbe6fb;
  --amber:#b86e00; --amber-fill:#fde9c4;
  --red:#c62f45; --red-fill:#fbd9de; --green-fill:#d6f0e1;
  --green:#1d7a4c;
  --accent:#2459c6; --accent-ink:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --r:14px;
}
/* dark mode: set by the script in <head> (saved choice, else device setting) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16171a; --card:#212226; --ink:#ececee; --muted:#a0a0a8; --line:#34353b;
  --grid:rgba(140,170,255,.08); --grid2:#3a4256;
  --blue:#7ea6ff; --blue-fill:#22345c;
  --amber:#f0b04a; --amber-fill:#4a3712;
  --red:#ff7b8e; --red-fill:#4d2129; --green-fill:#173a2a;
  --green:#5fd39a;
  --accent:#7ea6ff; --accent-ink:#0f1320;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.back{display:none;align-items:center;justify-content:center;min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;font-size:26px;cursor:pointer}
.back:hover{background:var(--line)}
.bar h1{flex:1;min-width:0;font-size:19px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.themebtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink)}
.themebtn:hover{background:var(--line)}
.themebtn svg{width:22px;height:22px;display:block}
.bar .crumb{color:var(--muted);font-weight:400}
.share{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;height:40px;padding:0 14px;cursor:pointer;font-size:15px;white-space:nowrap}
.share[hidden]{display:none}

/* ---------- home ---------- */
.hero{padding:28px 0 8px}
.hero h2{font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.level{margin:22px 0 30px}
.level h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:inherit;min-height:150px}
.card:hover{border-color:var(--accent)}
.card .thumb{height:64px;margin-bottom:4px}
.card b{font-size:18px}
.card span{color:var(--muted);font-size:15px}
.card .tags{display:flex;gap:6px;margin-top:auto}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}

/* ---------- topic ---------- */
.tabs{display:flex;gap:6px;padding:12px 0}
.tab{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;padding:0 18px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.play{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:18px;padding-bottom:24px;align-items:start}
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;position:sticky;top:68px}
.stage svg text{paint-order:stroke;stroke:var(--card);stroke-width:1.2px;stroke-linejoin:round}
.stage svg{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);touch-action:none}
.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stepnum{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.steptext{font-size:20px;margin:8px 0 0;min-height:3.2em}
.steptext .m{white-space:nowrap}
.nav{display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin:6px 0}
.ctrl label{font-weight:700;font-size:20px;font-style:italic;min-width:1.2em}
.ctrl output{font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right;font-size:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--accent);margin-top:-12px;border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.readout{font-size:18px;line-height:1.7;font-variant-numeric:tabular-nums}
.readout .row{display:block}
.k-blue{color:var(--blue);font-weight:700}
.k-amber{color:var(--amber);font-weight:700}
.k-red{color:var(--red);font-weight:700}
.k-green{color:var(--green);font-weight:700}
.mini{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:17px;margin-top:6px}
.mini th,.mini td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
.mini th{color:var(--muted);font-weight:400;font-size:14px}
.mini td:first-child,.mini th:first-child{text-align:left}
.mini tr.live td{background:var(--blue-fill)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;background:var(--card);cursor:pointer;font-weight:700}
.hint{color:var(--muted);font-size:15px;margin:0}

.nw{white-space:nowrap}
.explain ul{margin:0;padding-left:20px}
.explain li{margin:5px 0;font-size:17px;line-height:1.45}
.stage:has(.keybox:not(:empty)) svg{max-height:calc(100vh - 230px)}
.stage:has(.forms) svg{max-height:calc(100vh - 250px)}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;margin:2px 0 4px}
.formbox{border:2px solid var(--fc);background:var(--fb);border-radius:10px;padding:6px 10px}
.formbox .rd{font-size:13.5px;font-weight:700;color:var(--fc)}
.formbox .hd{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fc)}
.formbox .eq{font-size:18px;font-weight:700;white-space:nowrap;overflow-x:auto;color:var(--ink);padding:2px 0}
.fb-green{--fc:var(--green);--fb:var(--green-fill)} .fb-ink{--fc:var(--muted);--fb:var(--card)}
.forms.tight{grid-template-columns:repeat(3,minmax(0,1fr))}
.forms.tight .eq{text-align:center} .forms.tight .hd,.forms.tight .rd{text-align:center}
.khead{text-align:center;font-size:18px;font-weight:700;margin:2px 0 6px}
.reasonbox{grid-column:1/-1}
.fb-blue{--fc:var(--blue);--fb:var(--blue-fill)} .fb-red{--fc:var(--red);--fb:var(--red-fill)} .fb-amber{--fc:var(--amber);--fb:var(--amber-fill)}
.keybox{font-size:16px;line-height:1.55;padding:8px 8px 4px;margin-top:6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.keybox:empty{display:none}
.keybox .row{display:block}
.card .chap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag.lvl{color:var(--accent);border-color:var(--accent)}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.sm{min-height:40px;padding:0 12px;font-size:15px;font-weight:400}
.lim{display:inline-flex;flex-direction:column;font-size:.68em;line-height:1.05;vertical-align:middle;margin-left:1px}
.lim sub,.lim sup{vertical-align:baseline;font-size:1em}
/* math bits */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
s.cancel{text-decoration-color:var(--red);text-decoration-thickness:2px}
i.v{font-style:italic;font-family:"Times New Roman",Georgia,serif;font-size:1.08em}

/* ---------- cheatsheet ---------- */
.sheet{columns:2 420px;column-gap:18px;padding-bottom:30px}
.panelc{break-inside:avoid;display:inline-block;width:100%;position:relative;isolation:isolate;padding:0 16px 14px;margin:0 0 18px}
.panelc::before{content:"";position:absolute;inset:14px 0 0 0;z-index:-1;border:1.5px solid var(--ink);border-radius:12px;background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px}
.panelc>h4{display:inline-block;margin:0 0 10px -2px;background:var(--amber-fill);color:var(--ink);border:1.5px solid var(--ink);border-radius:8px;padding:2px 12px;font-size:16px}
.panelc table{width:100%;border-collapse:collapse;font-size:16.5px;background:var(--card)}
.panelc th,.panelc td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
.panelc th{font-size:15px;color:var(--muted);font-weight:700}
.big{font-size:21px;font-weight:700;text-align:center;margin:4px 0 8px}
.note{border-left:4px solid var(--red);background:var(--red-fill);border-radius:6px;padding:8px 12px;margin:10px 0 0;font-size:16px}
.note b{color:var(--red)}
.anno{color:var(--blue);font-size:15px}
.wrongright{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.wrongright div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16.5px}
.wrongright .x{color:var(--red)} .wrongright .ok{color:var(--green)}
.steps{margin:6px 0 0;padding:0;list-style:none;font-size:17px}
.steps li{padding:3px 0}
.steps li .tagop{color:var(--blue);font-size:14px;float:right;white-space:nowrap;margin-left:10px}
.badge{display:inline-block;font-size:12px;font-weight:700;background:var(--red-fill);color:var(--red);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.cmini{width:96px;min-width:84px;height:auto;display:block}
.miniq{width:72px;height:auto;display:block}
.panelc td.anno{font-size:14px;white-space:nowrap}
.sheetfoot{color:var(--muted);font-size:14px;padding:0 0 30px}

footer{color:var(--muted);font-size:13px;padding:30px 0 40px;text-align:center}

/* ---------- phone / portrait ---------- */
@media (max-width:860px), (orientation:portrait) and (max-width:1100px){
  .play{grid-template-columns:1fr}
  .stage{position:sticky;top:56px;z-index:3;padding:6px}
  .stage svg{max-height:46vh}
  .steptext{font-size:18px;min-height:0}
  .keybox{font-size:15px;padding:6px 4px 2px}
  .stage:has(.forms) svg{max-height:32vh}
  .formbox .eq{font-size:18px}
  .forms.tight .eq{font-size:16px}
  .forms.tight .hd{font-size:10.5px}
  .forms.tight .rd{font-size:12px}
  .khead{font-size:16px}
  .explain li{font-size:16px}
}
@media (max-width:520px){
  .panelc td.anno{white-space:normal}
  .cmini{width:84px;min-width:84px}
  .panelc td:first-child:has(.cmini){width:88px;padding:4px}
  .bar .crumb{display:none}
  .panelc table{font-size:15px}
  .panelc th,.panelc td{padding:6px 5px}
  body{font-size:16px}
  .hero h2{font-size:25px}
  .bar h1{font-size:17px}
  .share{padding:0 10px}
  .wrongright{grid-template-columns:1fr}
  .stage svg{max-height:40vh}
}
@media print{
  .bar,.tabs,footer{display:none}
  body{background:#fff}
  .panelc::before{border-color:#000}
}
</style>
</head>
<body>

<header class="bar"><div class="wrap">
  <button class="back" id="back" aria-label="Back">‹</button>
  <h1 id="title">Coach Minyi's Maths Hub</h1>
  <button class="share" id="share" hidden>Copy link</button>
  <button class="themebtn" id="themeBtn" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
</div></header>

<main class="wrap" id="app"></main>
<footer>Coach Minyi's Maths Hub · drag, tap and play around</footer>

<script>
/* =====================================================================
   DATA — add a topic here. level = which section it shows under.
   ===================================================================== */
const LEVELS = [
  {id:"sec1", name:"Sec 1"},
  {id:"sec2", name:"Sec 2"},
  {id:"emath", name:"E-Math (Sec 3–4)"},
  {id:"amath", name:"A-Math (Sec 3–4)"}
];

const TOPICS = [
  {id:"a-plus-b-squared", strand:"alg", levels:["sec2"], chapter:"Expansion & Factorisation",
   title:"Why (a + b)² = a² + 2ab + b²", blurb:"Cut a square into 4 pieces and see where the 2ab comes from.", play:"squareAB", sheet:"expansion"},
  {id:"complete-square", strand:"alg", levels:["emath","amath"], chapter:"Quadratic Functions",
   title:"Completing the square, with areas", blurb:"Cut, move and fill in the missing corner.", play:"complSq", sheet:"complSq", sheetTitle:"Completing the square"},
  {id:"quad-forms", strand:"alg", levels:["emath","amath"], chapter:"Quadratic Functions",
   title:"Quadratic graphs: 3 forms", blurb:"Drag the turning point. See all three forms change together.", play:"quadForms", sheet:"quadGraphs", sheetTitle:"Quadratic graphs"},
  {id:"discriminant", strand:"alg", levels:["amath"], chapter:"Equations & Inequalities",
   title:"Line meets curve: b² − 4ac", blurb:"Slide a line: cuts, touches or misses?", play:"discrim", sheet:"discrim", sheetTitle:"b² − 4ac (discriminant)"},
  {id:"unit-circle", strand:"trig", levels:["emath","amath"], chapter:"Trigonometry",
   title:"Unit circle & ASTC", blurb:"Why sin 150° = sin 30°, and where the signs come from.", play:"unitCircle", sheet:"trigAngles", sheetTitle:"Trig ratios of any angle"},
  {id:"trig-graphs", strand:"trig", levels:["amath"], chapter:"Trigonometry",
   title:"Trig graphs: what a, b, c do", blurb:"Stretch, squeeze and shift sin, cos and tan.", play:"trigGraphs", sheet:"trigGraphs", sheetTitle:"Trig graphs"},
  {id:"r-formula", strand:"trig", levels:["amath"], chapter:"Trigonometry",
   title:"R-formula: two waves make one", blurb:"Where R and α come from, and why max = R.", play:"rFormula", sheet:"rFormula", sheetTitle:"R-formula"},
  {id:"circle-props", strand:"geo", levels:["emath","amath"], chapter:"Properties of Circles",
   title:"Circle angle properties", blurb:"Drag points and watch the angles stay true. 7 properties.", play:"circleProps", sheet:"circles", sheetTitle:"Circle properties"},
  {id:"diff-x-squared", strand:"calc", levels:["amath"], chapter:"Differentiation",
   title:"Why x² differentiates to 2x", blurb:"Grow a square by h, then shrink h to 0.", play:"diffSquare", sheet:"diffBasics"},
  {id:"tangent-gradient", strand:"calc", levels:["amath"], chapter:"Differentiation",
   title:"Tangents, gradient & stationary points", blurb:"Slide the tangent. Uphill, downhill, flat.", play:"tangentAid", sheet:"diffApps", sheetTitle:"Differentiation: rules & uses"},
  {id:"area-under", strand:"calc", levels:["emath","amath"], chapter:"Integration",
   title:"Area under a graph = distance", blurb:"Speed–time area is distance. Differentiate and integrate between them.", play:"areaAid", sheet:"integration", sheetTitle:"Integration & area"}
];

/* =====================================================================
   helpers
   ===================================================================== */
const $ = (s,el=document)=>el.querySelector(s);
const h = (tag,attrs={},html="")=>{const e=document.createElement(tag);for(const k in attrs)e.setAttribute(k,attrs[k]);e.innerHTML=html;return e};
const SVGNS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs={},text){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
const fmt=(n,d=2)=>{const s=(+n).toFixed(d);return s.replace(/\.?0+$/,"")||"0"};
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const V=s=>`<i class="v">${s}</i>`;

/* =====================================================================
   PLAY 1 — (a+b)^2 area model
   ===================================================================== */
const squareAB = {
  steps:[
    {t:()=>`Here is a square. Each side is ${V("a")} + ${V("b")}.<br>So its area is (${V("a")} + ${V("b")})².`, show:{split:false}},
    {t:()=>`Cut each side into ${V("a")} and ${V("b")}. The square breaks into <b>4 pieces</b>.`, show:{split:true}},
    {t:()=>`Top-left piece: ${V("a")} × ${V("a")} = <span class="k-blue">${V("a")}²</span>`, show:{split:true,hi:"aa"}},
    {t:()=>`Two rectangles: ${V("a")} × ${V("b")} each.<br>Together = <span class="k-amber">2${V("ab")}</span>`, show:{split:true,hi:"ab"}},
    {t:()=>`Bottom-right piece: ${V("b")} × ${V("b")} = <span class="k-red">${V("b")}²</span>`, show:{split:true,hi:"bb"}},
    {t:()=>`Add all 4 pieces:<br><b>(${V("a")} + ${V("b")})² = <span class="k-blue">${V("a")}²</span> + <span class="k-amber">2${V("ab")}</span> + <span class="k-red">${V("b")}²</span></b>`, show:{split:true,hi:"all"}},
    {t:()=>`<span class="k-red">Common mistake:</span> (${V("a")} + ${V("b")})² = ${V("a")}² + ${V("b")}² ✗<br>That forgets the <span class="k-amber">2 rectangles</span>!`, show:{split:true,hi:"mistake"}}
  ],
  mount(stage,panel){
    const st={a:5,b:3,step:5};
    const svg=svgEl("svg",{viewBox:"0 0 130 126","aria-label":"Square of side a plus b split into four pieces"});
    stage.append(svg); const kb=h("div",{class:"keybox"}); stage.append(kb);
    panel.innerHTML=`${explainBox([`Big square = 4 pieces: <b>(${V("a")} + ${V("b")})² = ${V("a")}² + 2${V("ab")} + ${V("b")}²</b>`,`Don't forget the <span class="k-amber"><b>2 rectangles</b></span>!`])}
      <div class="box">
        <div class="ctrl"><label for="sa">a</label><input id="sa" type="range" min="1" max="8" step="1" value="5"><output></output></div>
        <div class="ctrl"><label for="sb">b</label><input id="sb" type="range" min="1" max="6" step="1" value="3"><output></output></div>
        <div class="readout" id="ro"></div>
      </div>
      <p class="hint">Drag the sliders. The rule works for any a and b.</p>`;
    const sa=$("#sa",panel), sb=$("#sb",panel), ro=$("#ro",panel);
    const draw=()=>{
      const {a,b,step}=st, S=this.steps[step].show;
      sa.nextElementSibling.textContent=a; sb.nextElementSibling.textContent=b;
      svg.innerHTML="";
      const sc=92/(a+b), x0=26, y0=12, A=a*sc, B=b*sc, T=A+B;
      const fade=k=>{ if(!S.split) return 1; if(!S.hi||S.hi==="all") return 1;

<div class="sheet">
  <div class="panelc"><h4>b² − 4ac and the roots of ax² + bx + c = 0</h4>
    <table>
      <tr><th>${V("b")}² − 4${V("ac")}</th><th>Roots</th><th>Graph</th></tr>
      <tr><td>&gt; 0</td><td>2 real, different roots</td><td>${miniQ(2)}</td></tr>
      <tr><td>= 0</td><td>2 real, equal roots</td><td>${miniQ(1)}</td></tr>
      <tr><td>&lt; 0</td><td>no real roots</td><td>${miniQ(0)}</td></tr>
    </table>
    <p class="anno">* "real roots" (any, equal or not) → ${V("b")}² − 4${V("ac")} ≥ 0</p>
  </div>

  <div class="panelc"><h4>Line and curve</h4>
    <ul class="steps">
      <li>① Substitute the line into the curve</li>
      <li>② Rearrange to (quadratic) = 0</li>
      <li>③ Use ${V("b")}² − 4${V("ac")} of <b>that</b> quadratic</li>
    </ul>
    <table>
      <tr><th>The question says</th><th>Use</th></tr>
      <tr><td>cuts / intersects at 2 points</td><td>${V("b")}² − 4${V("ac")} &gt; 0</td></tr>
      <tr><td>is a tangent / touches</td><td>${V("b")}² − 4${V("ac")} = 0</td></tr>
      <tr><td>meets / intersects</td><td>${V("b")}² − 4${V("ac")} ≥ 0</td></tr>
      <tr><td>does not meet</td><td>${V("b")}² − 4${V("ac")} &lt; 0</td></tr>
    </table>
  </div>

  <div class="panelc"><h4>Example: tangent</h4>
    <p>${V("y")} = ${X1} + ${V("k")} is a tangent to ${V("y")} = ${X2} − 3${X1} + 5. Find ${V("k")}.</p>
    <ul class="steps">
      <li>${X2} − 3${X1} + 5 = ${X1} + ${V("k")}</li>
      <li>${X2} − 4${X1} + (5 − ${V("k")}) = 0 <span class="tagop">a = 1, b = −4, c = 5 − k</span></li>
      <li>(−4)² − 4(1)(5 − ${V("k")}) = 0 <span class="tagop">tangent → = 0</span></li>
      <li>16 − 20 + 4${V("k")} = 0 → <b>${V("k")} = 1</b></li>
    </ul>
  </div>

  <div class="panelc"><h4>Always positive / always negative <span class="badge">A-Math</span></h4>
    <table>
      <tr><th>${V("a")}${X2} + ${V("b")}${X1} + ${V("c")} is…</th><th>Conditions</th></tr>
      <tr><td>always positive (for all ${X1})</td><td>${V("a")} &gt; 0 <b>and</b> ${V("b")}² − 4${V("ac")} &lt; 0</td></tr>
      <tr><td>always negative (for all ${X1})</td><td>${V("a")} &lt; 0 <b>and</b> ${V("b")}² − 4${V("ac")} &lt; 0</td></tr>
    </table>
  </div>

  <div class="panelc"><h4>Note!</h4>
    <div class="wrongright">
      <div class="x">✗ using the line's ${V("c")} in ${V("b")}² − 4${V("ac")}</div>
      <div class="ok">✓ rearrange to … = 0 first, then read ${V("a")}, ${V("b")}, ${V("c")}</div>
    </div>
    <div class="note"><b>Note!</b> In the example above, ${V("c")} = 5 − ${V("k")}, not ${V("k")} and not 5.</div>
    <div class="note"><b>Note!</b> If ${V("k")} is in front of ${X2}, you also need ${V("a")} ≠ 0 for it to be a quadratic (and ${V("a")} &gt; 0 or ${V("a")} &lt; 0 for always positive / negative).</div>
  </div>
</div>`,

      <tr><td>${V("a")} cos θ + ${V("b")} sin θ</td><td>${V("R")} cos(θ − α)</td></tr>
      <tr><td>${V("a")} cos θ − ${V("b")} sin θ</td><td>${V("R")} cos(θ + α)</td></tr>
    </table>
    <p class="big">${V("R")} = √(${V("a")}² + ${V("b")}²) &nbsp;·&nbsp; tan ${AL} = ${frac(V("b"),V("a"))}</p>
    <p class="anno">* ${V("a")}, ${V("b")} &gt; 0 and ${AL} acute. ${V("a")} = the number in front of the ratio named in the R-form.</p>
  </div>

  <div class="panelc"><h4>Where R and α come from</h4>
    <svg viewBox="0 0 220 98" style="width:100%;max-width:300px;display:block;margin:0 auto">
      <path d="M20 78 L110 78 L110 18 Z" fill="var(--blue-fill)" stroke="var(--ink)" stroke-width="1.2"/>
      <path d="M102 78 L102 70 L110 70" fill="none" stroke="var(--ink)"/>
      <path d="M44 78 A24 24 0 0 0 40 65" fill="none" stroke="var(--red)" stroke-width="1.5"/>
      <text x="50" y="72" font-size="13" fill="var(--red)" font-weight="700">α</text>
      <text x="65" y="92" font-size="13" text-anchor="middle" fill="var(--amber)" font-weight="700">a</text>
      <text x="116" y="52" font-size="13" fill="var(--green)" font-weight="700">b</text>
      <text x="56" y="40" font-size="13" fill="var(--blue)" font-weight="700">R</text>
      <text x="135" y="40" font-size="12" fill="var(--ink)">R = √(a² + b²)</text>
      <text x="135" y="60" font-size="12" fill="var(--ink)">tan α = b ÷ a</text>
    </svg>
  </div>

  <div class="panelc"><h4>Max and min</h4>
    <ul class="steps">
      <li>3 cos θ + 4 sin θ = 5 cos(θ − 53.13°)</li>
      <li>Max = <b>5</b> when θ − 53.13° = 0° → θ = 53.1°</li>
      <li>Min = <b>−5</b> when θ − 53.13° = 180° → θ = 233.1°</li>
    </ul>
    <p class="anno">* max = ${V("R")}, min = −${V("R")}, because sin and cos are always between −1 and 1</p>
  </div>

  <div class="panelc"><h4>Solve, step by step</h4>
    <p>3 cos θ + 4 sin θ = 2.5, for 0° ≤ θ ≤ 360°</p>
    <ul class="steps">
      <li>① 5 cos(θ − 53.13°) = 2.5</li>
      <li>② cos(θ − 53.13°) = 0.5 <span class="tagop">÷ 5</span></li>
      <li>③ Range: −53.13° ≤ θ − 53.13° ≤ 306.87° <span class="tagop">− 53.13° all round</span></li>
      <li>④ θ − 53.13° = 60° or 300° <span class="anno">(−60° is outside the range, so reject it)</span></li>
      <li>⑤ θ = <b>113.1°</b> or <b>353.1°</b></li>
    </ul>
  </div>

  <div class="panelc"><h4>Note!</h4>
    <div class="wrongright">
      <div class="x">✗ tan α = ${frac(V("a"),V("b"))}</div>
      <div class="ok">✓ tan α = ${frac(V("b"),V("a"))}</div>
    </div>
    <div class="note"><b>Note!</b> Keep α to 2 d.p. while working; give final angles to 1 d.p. Always shift the range in step ③ before solving.</div>
  </div>
</div>`,

diffApps:`
<div class="sheet">
  <div class="panelc"><h4>Rules <span class="badge">memorise: not on the formula sheet</span></h4>
    <table>
      <tr><th>${V("y")}</th><th>${frac("d"+V("y"),"d"+V("x"))}</th></tr>
      <tr><td>${V("x")}<sup>${V("n")}</sup></td><td>${V("n")}${V("x")}<sup>${V("n")} − 1</sup></td></tr>
      <tr><td>sin ${X1}</td><td>cos ${X1}</td></tr>
      <tr><td>cos ${X1}</td><td>−sin ${X1}</td></tr>
      <tr><td>tan ${X1}</td><td>sec² ${X1}</td></tr>
      <tr><td>e<sup>${X1}</sup></td><td>e<sup>${X1}</sup></td></tr>
      <tr><td>ln ${X1}</td><td>${frac("1",X1)}</td></tr>
      <tr><td>Chain rule: <span class="nw">(2${X1} + 1)⁵</span></td><td><span class="nw">5(2${X1} + 1)⁴ × 2</span> = <span class="nw">10(2${X1} + 1)⁴</span></td></tr>
      <tr><td><span class="nw">sin(${V("a")}${X1} + ${V("b")})</span></td><td><span class="nw">${V("a")} cos(${V("a")}${X1} + ${V("b")})</span></td></tr>
      <tr><td>e<sup>${V("a")}${X1} + ${V("b")}</sup></td><td>${V("a")}e<sup>${V("a")}${X1} + ${V("b")}</sup></td></tr>
      <tr><td><span class="nw">ln(${V("a")}${X1} + ${V("b")})</span></td><td>${frac(V("a"),V("a")+X1+" + "+V("b"))}</td></tr>
      <tr><td>Product: ${V("uv")}</td><td>${V("u")}${frac("d"+V("v"),"d"+V("x"))} + ${V("v")}${frac("d"+V("u"),"d"+V("x"))}</td></tr>
      <tr><td>Quotient: ${frac(V("u"),V("v"))}</td><td>${frac(V("v")+frac("d"+V("u"),"d"+V("x"))+" − "+V("u")+frac("d"+V("v"),"d"+V("x")),V("v")+"²")}</td></tr>
    </table>
    <p class="anno">* quotient: differentiate top, copy bottom, minus differentiate bottom, copy top, over bottom squared</p>
    <p class="anno">* trig rules need ${X1} in radians</p>
  </div>

  <div class="panelc"><h4>Tangent and normal</h4>
    <svg viewBox="0 0 200 80" style="width:100%;max-width:260px;display:block;margin:0 auto">
      <path d="M20 75 Q70 -10 180 20" fill="none" stroke="var(--blue)" stroke-width="2"/>
      <line x1="19.3" y1="61.2" x2="91.5" y2="7.5" stroke="var(--green)" stroke-width="1.6"/>
      <line x1="34.5" y1="6.3" x2="76.3" y2="62.5" stroke="var(--amber)" stroke-width="1.6"/>
      <circle cx="55.4" cy="34.4" r="3" fill="var(--ink)"/>
      <text x="94" y="12" font-size="12" fill="var(--green)">tangent</text><text x="80" y="66" font-size="12" fill="var(--amber)">normal</text>
    </svg>
    <ul class="steps">
      <li>Gradient of tangent ${V("m")} = ${frac("d"+V("y"),"d"+V("x"))} at that point</li>
      <li>Gradient of normal = −${frac("1",V("m"))} <span class="tagop">normal ⊥ tangent</span></li>
      <li>Equation: <span class="nw">${V("y")} − ${V("y")}₁ = ${V("m")}(${X1} − ${X1}₁)</span></li>
    </ul>
    <p class="anno">* if ${V("m")} = 0: tangent is ${V("y")} = ${V("y")}₁, normal is the vertical line ${X1} = ${X1}₁</p>
    <p class="anno">* ${V("y")} = ${X2} at (1, 1): ${V("m")} = 2 → tangent ${V("y")} = 2${X1} − 1; normal ${V("y")} = −${frac("1","2")}${X1} + ${frac("3","2")}</p>
  </div>

  <div class="panelc"><h4>Increasing, decreasing, stationary</h4>

      <tr><th>${frac("d"+V("y"),"d"+V("x"))}</th><th>Meaning</th></tr>
      <tr><td>&gt; 0</td><td>increasing ↗</td></tr>
      <tr><td>&lt; 0</td><td>decreasing ↘</td></tr>
      <tr><td>= 0</td><td>stationary point (find both ${X1} and ${V("y")})</td></tr>
    </table>
    <p class="anno">* "show increasing for all ${X1}": ${V("y")} = ${V("x")}³ + 3${X1} → ${frac("d"+V("y"),"d"+V("x"))} = 3${X2} + 3 &gt; 0, since ${X2} ≥ 0</p>
  </div>

  <div class="panelc"><h4>Max, min or inflexion?</h4>

      <tr><th>Test</th><th>Maximum</th><th>Minimum</th><th>Inflexion</th></tr>
      <tr><td>${frac("d²"+V("y"),"d"+V("x")+"²")}</td><td>&lt; 0</td><td>&gt; 0</td><td>—</td></tr>
      <tr><td>Sign of ${frac("d"+V("y"),"d"+V("x"))} (before → at → after)</td><td><span class="nw">+ → 0 → −</span></td><td><span class="nw">− → 0 → +</span></td><td><span class="nw">+ → 0 → +</span> or <span class="nw">− → 0 → −</span></td></tr>
    </table>
    <p class="anno">* ${frac("d²"+V("y"),"d"+V("x")+"²")} = 0 → this test can't tell. Use the sign test (it could be max, min or inflexion).</p>
    <ul class="steps">

    <div class="note"><b>Note!</b> ${frac("d²"+V("y"),"d"+V("x")+"²")} = 0 does <b>not</b> mean inflexion. Check the sign of ${frac("d"+V("y"),"d"+V("x"))} on both sides.</div>
  </div>
</div>`,

<div class="sheet">
  <div class="panelc"><h4>Why area under a graph = integral</h4>
    <ul class="steps">
      <li>Area under a speed–time graph = distance travelled</li>
      <li>Differentiate distance → speed: ${frac("d"+V("s"),"d"+V("t"))} = ${V("v")}</li>
      <li>Integrate speed → distance: ${V("s")} = ∫ ${V("v")} d${V("t")}</li>
    </ul>
    <p class="anno">* below the axis (moving backwards) the area counts as negative. <a href="#area-under">Open the Play tab</a></p>
  </div>
  <div class="panelc"><h4>Rules <span class="badge">memorise: not on the formula sheet</span></h4>
    <table>
      <tr><th>∫ … d${X1}</th><th>Answer (+ ${V("c")})</th></tr>
      <tr><td>${X1}<sup>${V("n")}</sup> (${V("n")} ≠ −1)</td><td>${frac(X1+"<sup>"+V("n")+" + 1</sup>",V("n")+" + 1")}</td></tr>
      <tr><td>(${V("a")}${X1} + ${V("b")})<sup>${V("n")}</sup> (${V("n")} ≠ −1)</td><td>${frac("("+V("a")+X1+" + "+V("b")+")<sup>"+V("n")+" + 1</sup>",V("a")+"("+V("n")+" + 1)")}</td></tr>
      <tr><td>sin ${X1}</td><td>−cos ${X1}</td></tr>
      <tr><td>cos ${X1}</td><td>sin ${X1}</td></tr>
      <tr><td>sec² ${X1}</td><td>tan ${X1}</td></tr>
      <tr><td>sin(${V("a")}${X1} + ${V("b")})</td><td>−${frac("1",V("a"))} cos(${V("a")}${X1} + ${V("b")})</td></tr>
      <tr><td>cos(${V("a")}${X1} + ${V("b")})</td><td>${frac("1",V("a"))} sin(${V("a")}${X1} + ${V("b")})</td></tr>
      <tr><td>e<sup>${X1}</sup></td><td>e<sup>${X1}</sup></td></tr>
      <tr><td>e<sup>${V("a")}${X1} + ${V("b")}</sup></td><td>${frac("1",V("a"))}e<sup>${V("a")}${X1} + ${V("b")}</sup></td></tr>
    </table>
    <p class="anno">* add 1 to the power, divide by the new power (and by ${V("a")}, the number in front of ${X1})</p>

  <div class="panelc"><h4>Definite integral</h4>

  <div class="panelc"><h4>Curve and a straight line</h4>

      <div class="ok">✓ −cos ${X1} + ${V("c")}</div>
    </div>
    <div class="note"><b>Note!</b> Indefinite integral → always + ${V("c")}. Trig integrals need ${X1} in radians.</div>
  </div>
</div>`

};

/* =====================================================================
   ROUTER  —  #            home
              #<topic>     topic, Play tab
              #<topic>/sheet   topic, Cheatsheet tab
   ===================================================================== */
const app=$("#app"), titleEl=$("#title"), backBtn=$("#back"), shareBtn=$("#share");
let homeFilter="all";
try{ homeFilter=localStorage.getItem("hubFilter")||"all" }catch(e){}

function thumbFor(t){
  if(t.play==="squareAB") return `<svg class="thumb" viewBox="0 0 120 64"><rect x="2" y="2" width="36" height="36" fill="var(--blue-fill)" stroke="var(--ink)"/><rect x="38" y="2" width="22" height="36" fill="var(--amber-fill)" stroke="var(--ink)"/><rect x="2" y="38" width="36" height="22" fill="var(--amber-fill)" stroke="var(--ink)"/><rect x="38" y="38" width="22" height="22" fill="var(--red-fill)" stroke="var(--ink)"/></svg>`;
  if(t.play==="diffSquare") return `<svg class="thumb" viewBox="0 0 120 64"><rect x="2" y="2" width="44" height="44" fill="var(--blue-fill)" stroke="var(--ink)"/><rect x="46" y="2" width="12" height="44" fill="var(--amber-fill)" stroke="var(--amber)"/><rect x="2" y="46" width="44" height="12" fill="var(--amber-fill)" stroke="var(--amber)"/><rect x="46" y="46" width="12" height="12" fill="var(--red-fill)" stroke="var(--red)"/><text x="68" y="36" font-size="15" fill="var(--muted)">h → 0</text></svg>`;
  const T={
   complSq:`<rect x="2" y="2" width="38" height="38" fill="var(--blue-fill)" stroke="var(--ink)"/><rect x="40" y="2" width="14" height="38" fill="var(--amber-fill)" stroke="var(--ink)"/><rect x="2" y="40" width="38" height="14" fill="var(--amber-fill)" stroke="var(--ink)"/><rect x="40" y="40" width="14" height="14" fill="var(--red-fill)" stroke="var(--red)" stroke-dasharray="3 2"/>`,
   quadForms:`<path d="M10 4 Q40 110 70 4" fill="none" stroke="var(--blue)" stroke-width="2.5"/><circle cx="40" cy="57" r="4" fill="var(--accent)"/><line x1="0" y1="40" x2="110" y2="40" stroke="var(--muted)"/>`,
   discrim:`<path d="M10 4 Q45 100 80 4" fill="none" stroke="var(--blue)" stroke-width="2.5"/><line x1="0" y1="52" x2="110" y2="52" stroke="var(--amber)" stroke-width="2"/><line x1="0" y1="60" x2="110" y2="20" stroke="var(--green)" stroke-width="2"/>`,
   unitCircle:`<circle cx="32" cy="32" r="28" fill="none" stroke="var(--ink)" stroke-width="1.5"/><line x1="32" y1="32" x2="56" y2="18" stroke="var(--ink)" stroke-width="1.5"/><line x1="56" y1="18" x2="56" y2="32" stroke="var(--blue)" stroke-width="3"/><line x1="32" y1="32" x2="56" y2="32" stroke="var(--amber)" stroke-width="3"/><text x="72" y="26" font-size="16" font-weight="700" fill="var(--accent)">S A</text><text x="72" y="50" font-size="16" font-weight="700" fill="var(--accent)">T C</text>`,
   trigGraphs:`<path d="M0 32 C12 0 24 0 30 32 S48 64 60 32 S84 0 90 32 S108 64 116 40" fill="none" stroke="var(--blue)" stroke-width="2.5"/><line x1="0" y1="32" x2="120" y2="32" stroke="var(--muted)"/>`,
   rFormula:`<path d="M0 32 C10 10 20 10 30 32 S50 54 60 32 S80 10 90 32" fill="none" stroke="var(--amber)" stroke-dasharray="3 2"/><path d="M0 20 C12 -6 26 -6 36 30 S60 70 72 30 S96 -6 110 24" fill="none" stroke="var(--blue)" stroke-width="2.5"/>`,
   circleProps:`<circle cx="32" cy="32" r="28" fill="none" stroke="var(--ink)" stroke-width="1.5"/><path d="M8 46 L32 32 L56 46 M8 46 L32 4 L56 46" fill="none" stroke="var(--blue)" stroke-width="1.5"/><text x="70" y="38" font-size="13" fill="var(--muted)">2× rule</text>`,
   tangentAid:`<path d="M4 60 C30 -20 60 90 100 4" fill="none" stroke="var(--blue)" stroke-width="2.5"/><line x1="20" y1="22" x2="80" y2="22" stroke="var(--amber)" stroke-width="2"/>`,
   areaAid:`<path d="M6 58 Q36 -6 66 30 L66 58 Z" fill="var(--blue-fill)"/><path d="M6 58 Q36 -6 66 30 Q80 48 96 58" fill="none" stroke="var(--blue)" stroke-width="2.5"/><line x1="6" y1="58" x2="110" y2="58" stroke="var(--muted)"/><text x="70" y="22" font-size="12" fill="var(--muted)">area = distance</text>`};
  return T[t.play]?`<svg class="thumb" viewBox="0 0 120 64">${T[t.play]}</svg>`:"";
}

const STRANDS=[["alg","Algebra & Graphs"],["trig","Trigonometry"],["geo","Geometry"],["calc","Calculus"]];
const SHORT={sec1:"Sec 1",sec2:"Sec 2",emath:"E-Math",amath:"A-Math"};
function renderHome(){
  document.title="Coach Minyi's Maths Hub";
  titleEl.textContent="Coach Minyi's Maths Hub";
  backBtn.style.display="none"; shareBtn.hidden=true;
  const used=LEVELS.filter(l=>TOPICS.some(t=>t.levels.includes(l.id)));
  if(homeFilter!=="all"&&!used.some(l=>l.id===homeFilter)) homeFilter="all";
  app.innerHTML=`<section class="hero"><h2>Play with the maths.</h2><p>Drag, press Next, and see <i>why</i> the rules work. Each topic has a cheatsheet too.</p></section>`;
  const chips=h("div",{class:"chips",role:"group","aria-label":"Choose level"});
  [{id:"all",name:"All"},...used.map(l=>({id:l.id,name:SHORT[l.id]}))].forEach(l=>{
    const c=h("button",{class:"chip","aria-pressed":String(homeFilter===l.id)},l.name);
    c.onclick=()=>{homeFilter=l.id;try{localStorage.setItem("hubFilter",l.id)}catch(e){};renderHome()};
    chips.append(c);
  });
  app.append(chips);
  const shown=TOPICS.filter(t=>homeFilter==="all"||t.levels.includes(homeFilter));
  STRANDS.forEach(([sid,sname])=>{
    const list=shown.filter(t=>t.strand===sid); if(!list.length) return;
    const sec=h("section",{class:"level"},`<h3>${sname}</h3>`), grid=h("div",{class:"cards"});
    list.forEach(t=>grid.append(h("a",{class:"card",href:"#"+t.id},
      `${thumbFor(t)}<span class="chap">${t.chapter}</span><b>${t.title}</b><span>${t.blurb}</span><div class="tags">${t.levels.map(l=>`<span class="tag lvl">${SHORT[l]}</span>`).join("")}</div>`)));
    sec.append(grid); app.append(sec);
  });
  window.scrollTo(0,0);
}

function renderTopic(t,tab){
  if(tab==="sheet"&&!t.sheet) tab="play";
  if(tab==="play"&&!t.play) tab="sheet";
  const lvl=LEVELS.find(l=>l.id===(t.levels.includes(homeFilter)?homeFilter:t.levels[0]));
  document.title=t.title+" · Maths Hub";
  titleEl.innerHTML=`<span class="crumb">${lvl.name} ·</span> ${t.chapter}`;
  backBtn.style.display="inline-flex"; shareBtn.hidden=false;
  app.innerHTML="";
  const tabs=h("div",{class:"tabs",role:"tablist"});
  [["play","Play",t.play],["sheet","Cheatsheet",t.sheet]].forEach(([k,name,has])=>{
    if(!has) return;
    const b=h("button",{class:"tab",role:"tab","aria-selected":String(tab===k)},name);
    b.onclick=()=>{location.hash=t.id+(k==="sheet"?"/sheet":"")};
    tabs.append(b);
  });
  if(t.play&&t.sheet) app.append(tabs); else app.append(h("div",{style:"height:12px"}));
  if(tab==="play"){
    const wrap=h("div",{class:"play"}), stage=h("div",{class:"stage"}), panel=h("div",{class:"panel"});
    wrap.append(stage,panel); app.append(wrap);
    PLAYS[t.play].mount(stage,panel);
  } else {
    app.insertAdjacentHTML("beforeend",`<h2 style="margin:6px 0 22px;font-size:24px">${t.sheetTitle||t.chapter} — cheatsheet</h2>`+SHEETS[t.sheet]);
  }
  window.scrollTo(0,0);
}

function route(){
  const raw=decodeURIComponent(location.hash.replace(/^#\/?/,""));
  const [id,tab]=raw.split("/");
  const t=TOPICS.find(x=>x.id===id);
  if(t) renderTopic(t,tab==="sheet"?"sheet":"play"); else renderHome();
}
backBtn.onclick=()=>{ location.hash=""; };
shareBtn.onclick=async()=>{
  const url=location.href;
  try{
    if(navigator.share){ await navigator.share({title:document.title,url}); return; }
    await navigator.clipboard.writeText(url);
    shareBtn.textContent="Copied ✓"; setTimeout(()=>shareBtn.textContent="Copy link",1500);
  }catch(e){}
};
/* ---------- light / dark toggle (hubTheme lives in <head>) ---------- */
const themeBtn=$("#themeBtn");
const SUN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
const MOON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const isDark=()=>document.documentElement.getAttribute("data-theme")==="dark";
function paintThemeBtn(){
  const lbl=isDark()?"Switch to light mode":"Switch to dark mode";
  themeBtn.innerHTML=isDark()?SUN:MOON;
  themeBtn.setAttribute("aria-label",lbl); themeBtn.title=lbl;
}
themeBtn.onclick=()=>{
  const t=isDark()?"light":"dark";
  hubTheme(t); try{localStorage.setItem("hubTheme",t)}catch(e){}
  paintThemeBtn();
};
// no saved choice yet → keep following the device if it switches light/dark
const sysDark=matchMedia("(prefers-color-scheme: dark)");
const followDevice=()=>{ if(!hubSavedTheme()){ hubTheme(sysDark.matches?"dark":"light"); paintThemeBtn(); } };
if(sysDark.addEventListener) sysDark.addEventListener("change",followDevice); else if(sysDark.addListener) sysDark.addListener(followDevice);
// always print in light colours
let themeBeforePrint=null;
window.addEventListener("beforeprint",()=>{ themeBeforePrint=document.documentElement.getAttribute("data-theme"); hubTheme("light"); });
window.addEventListener("afterprint",()=>{ if(themeBeforePrint) hubTheme(themeBeforePrint); themeBeforePrint=null; });
paintThemeBtn();

window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
