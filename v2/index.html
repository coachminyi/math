<style>
:root{
  color-scheme:light;
  --bg:#f7f5ef; --card:#ffffff; --ink:#1c1c1e; --muted:#6b6b70; --line:#dedad0;
  --grid:rgba(60,90,160,.09); --grid2:#cfd6e6;
  --blue:#2459c6; --blue-fill:#dbe6fb;
  --amber:#a86400; --amber-fill:#fde9c4;
  --red:#c62f45; --red-fill:#fbd9de; --green-fill:#d6f0e1;
  --green:#1d7a4c;
  --accent:#2459c6; --accent-ink:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --r:14px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16171a; --card:#212226; --ink:#ececee; --muted:#a0a0a8; --line:#34353b;
  --grid:rgba(140,170,255,.08); --grid2:#3a4256;
  --blue:#7ea6ff; --blue-fill:#22345c;
  --amber:#f0b04a; --amber-fill:#4a3712;
  --red:#ff7b8e; --red-fill:#4d2129; --green-fill:#173a2a;
  --green:#5fd39a;
  --accent:#7ea6ff; --accent-ink:#0f1320;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:56px;padding-top:4px;padding-bottom:4px}
.back{display:none;align-items:center;justify-content:center;min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;font-size:26px;cursor:pointer;flex:none}
.back:hover{background:var(--line)}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.bar h1{font-size:19px;margin:0;font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar .crumb{color:var(--muted);font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumb:empty{display:none}
.ibtn,.themebtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink);padding:0 8px;font-size:15px;white-space:nowrap;flex:none}
.ibtn:hover,.themebtn:hover{background:var(--line)}
.ibtn svg,.themebtn svg{width:22px;height:22px;display:block;flex:none}
.ibtn[hidden],.themebtn[hidden]{display:none}

.hero{padding:28px 0 8px}
.hero h2{font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}

.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.level{margin:22px 0 30px}
.level h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:inherit;min-height:150px}

.card .txt{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}

.card span{color:var(--muted);font-size:15px}
.card .tags{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}

.tabs{display:flex;gap:6px;padding:12px 0}
.tab{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;padding:0 18px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.play{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:18px;padding-bottom:24px;align-items:start}
.left{position:sticky;top:calc(var(--barh,56px) + 12px);display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;position:relative}
.stage svg text{paint-order:stroke;stroke:var(--card);stroke-width:1.2px;stroke-linejoin:round}
.stage svg{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);touch-action:none}
.key{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 12px 10px}
.key.empty{display:none}
.sheetlink{text-decoration:none;align-self:flex-start;font-weight:400}
.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stepnum{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.steptext{font-size:20px;margin:8px 0 0;min-height:3.2em}
.steptext .m{white-space:nowrap}
.nav{display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.ctrl{display:flex;align-items:center;gap:8px;margin:6px 0}
.ctrl label{font-weight:700;font-size:20px;font-style:italic;min-width:1.2em;flex:none}
.ctrl input[type=range]{flex:1;min-width:50px}
.ctrl output{font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right;font-size:18px;flex:none}
.stp{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:700;line-height:1;padding:0;cursor:pointer}
.stp:active{background:var(--line)}
.stp:disabled{opacity:.35}
.numwrap{flex:none}
.ctrl:has(.numbox) output{display:none}
.numwrap{display:flex;align-items:center;gap:4px}
.numbox{width:4.6em;min-height:44px;font-size:18px;font-variant-numeric:tabular-nums;text-align:center;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 4px;-moz-appearance:textfield;appearance:textfield}
.numbox::-webkit-inner-spin-button,.numbox::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numbox:focus{outline:none;border-color:var(--accent)}
.numbox.bad{border-color:var(--red)}
.numbox:disabled{opacity:.35}
.numwrap .unit{font-size:16px;color:var(--muted)}
.numwrap .unit:empty{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--accent);margin-top:-12px;border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.readout{font-size:18px;line-height:1.7;font-variant-numeric:tabular-nums}
.readout .row{display:block}
.k-blue{color:var(--blue);font-weight:700}
.k-amber{color:var(--amber);font-weight:700}
.k-red{color:var(--red);font-weight:700}
.k-green{color:var(--green);font-weight:700}
.mini{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:17px;margin-top:6px}
.mini th,.mini td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
.mini th{color:var(--muted);font-weight:400;font-size:14px}
.mini td:first-child,.mini th:first-child{text-align:left}
.mini tr.live td{background:var(--blue-fill)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;background:var(--card);cursor:pointer;font-weight:700}
.hint{color:var(--muted);font-size:15px;margin:0}

.nw{white-space:nowrap}
.explain ul{margin:0;padding-left:20px}
.explain li{margin:5px 0;font-size:17px;line-height:1.45}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;margin:2px 0 4px}
.formbox{border:2px solid var(--fc);background:var(--fb);border-radius:10px;padding:6px 10px}
.formbox .rd{font-size:13.5px;font-weight:700;color:var(--ft,var(--ink))}
.formbox .hd{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ft,var(--ink))}
.formbox .eq{font-size:18px;font-weight:700;white-space:nowrap;overflow-x:auto;color:var(--ink);padding:2px 0}
.fb-green{--fc:var(--green);--fb:var(--green-fill)} .fb-ink{--fc:var(--muted);--fb:var(--card);--ft:var(--muted)}
.forms.tight{grid-template-columns:repeat(3,minmax(0,1fr))}
.forms.tight .eq{text-align:center} .forms.tight .hd,.forms.tight .rd{text-align:center}
.khead{text-align:center;font-size:18px;font-weight:700;margin:2px 0 6px}
.kpair{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:baseline;column-gap:10px;row-gap:2px;margin:2px 0 8px}
.kpair .gl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right}
.kpair .ge{font-size:18px}
.kpair .se{font-size:18px;font-weight:700}
.formbox .gen{font-size:15px;color:var(--ink);padding-top:1px}
.formbox .eq .brk{white-space:normal}
.formbox .hd i.v,.formbox .hd [class*="k-"],.formbox .hd .frac,.formbox .hd .m{text-transform:none}
.reasonbox,.formbox.wide{grid-column:1/-1}
.fb-blue{--fc:var(--blue);--fb:var(--blue-fill)} .fb-red{--fc:var(--red);--fb:var(--red-fill)} .fb-amber{--fc:var(--amber);--fb:var(--amber-fill)}
.keybox{font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
.keybox:empty{display:none}
.keybox .row{display:block}
.card .chap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag.lvl{color:var(--accent);border-color:var(--accent)}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.sm{min-height:40px;padding:0 12px;font-size:15px;font-weight:400}
.plbl{align-self:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.lim{display:inline-flex;flex-direction:column;font-size:.68em;line-height:1.05;vertical-align:middle;margin-left:1px}
.lim sub,.lim sup{vertical-align:baseline;font-size:1em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
s.cancel{text-decoration-color:var(--red);text-decoration-thickness:2px}
i.v{font-style:italic;font-family:"STIX Two Text","Times New Roman",Georgia,serif;font-size:1.05em}

.sheet{columns:2 420px;column-gap:18px;padding-bottom:30px}
.panelc{break-inside:avoid;display:inline-block;width:100%;position:relative;isolation:isolate;padding:0 16px 14px;margin:0 0 18px}
.panelc::before{content:"";position:absolute;inset:14px 0 0 0;z-index:-1;border:1.5px solid var(--ink);border-radius:12px;background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px}
.panelc>h4{display:inline-block;margin:0 0 10px -2px;background:var(--amber-fill);color:var(--ink);border:1.5px solid var(--ink);border-radius:8px;padding:2px 12px;font-size:16px}
.panelc table{width:100%;border-collapse:collapse;font-size:16px;background:var(--card)}
.panelc th,.panelc td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
.panelc th{font-size:15px;color:var(--muted);font-weight:700}
.big{font-size:19px;font-weight:700;text-align:center;margin:4px 0 8px}
.note{border-left:4px solid var(--red);background:var(--red-fill);border-radius:6px;padding:8px 12px;margin:10px 0 0;font-size:16px}
.note b{color:var(--red)}
.anno{color:var(--blue);font-size:15px}
.wrongright{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.wrongright div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px}
.wrongright .x{color:var(--red)} .wrongright .ok{color:var(--green)}
.steps{margin:6px 0 0;padding:0;list-style:none;font-size:17px}
.steps li{padding:3px 0}
.steps li .tagop{color:var(--blue);font-size:14px;float:right;white-space:nowrap;margin-left:10px}
.badge{display:inline-block;font-size:12px;font-weight:700;background:var(--red-fill);color:var(--red);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.cmini{width:96px;min-width:84px;height:auto;display:block}
.miniq{width:72px;height:auto;display:block}
.miniqf{width:76px;height:auto;display:block;margin:4px auto 0}
.panelc td.exs{text-align:center}
.panelc td .cap{display:block;font-size:12.5px;color:var(--blue);text-align:center;white-space:nowrap}
.panelc td.anno{font-size:14px;white-space:nowrap}
.sheetfoot{color:var(--muted);font-size:14px;padding:0 0 30px}

.homeswitch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 0}
.hs{min-height:52px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}
.hs[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.srows{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:inherit;min-height:52px;box-shadow:var(--shadow)}
.srow:hover{border-color:var(--accent)}
.srow .chap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:0 0 100%}
.srow b{font-size:17px;flex:1;min-width:0}
.srow .tags{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;margin-left:auto;align-items:center}
.srow .tag{flex:0 0 auto}
.piccard svg.ico{width:64px;margin:6px auto 8px}
.srow[hidden],section.level[hidden]{display:none}
.tag.aidtag{color:var(--green);border-color:var(--green)}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:0 14px;margin:14px 0 4px}
.sheeth{margin:6px 0 16px;font-size:24px}
.must{margin:0 0 18px}
.musth{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700}
.must .forms{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.must .formbox{padding:8px 12px}
.must .formbox .eq{font-size:17px;line-height:1.35}
.must .formbox .rd{font-size:14px}
.piccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 4px}
.piccards.two{grid-template-columns:1fr 1fr}
.piccard{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-decoration:none;color:inherit;text-align:center}

.piccard .pt{font-size:15.5px;line-height:1.3}
.piccard .anno{margin-top:4px}
.piccard .go{margin-top:6px;font-size:13px;font-weight:700;color:var(--accent)}
.piclink{display:block}
.playlink{text-decoration:none;color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.miniw{width:100%;max-width:200px;height:auto;display:block;margin:0 auto}
.quadpic{width:100%;max-width:300px;display:block;margin:0 auto}
.quadpic a{text-decoration:none}
footer{color:var(--muted);font-size:13px;padding:30px 0 40px;text-align:center}

  .hero{padding:18px 0 4px}

  .level{margin:16px 0 22px}
  .formbox .eq{font-size:calc(18*var(--k))}
  .formbox .hd{font-size:calc(12*var(--k))}

<script>

const TOPICS = [
  {id:"a-plus-b-squared", strand:"alg", levels:["sec2"], chapter:"Expansion & Factorisation",
   title:"Why (a + b)² = a² + 2ab + b²", blurb:"Cut a square into 4 pieces and see where the 2ab comes from.", play:"squareAB", sheet:"expansion"},

const $ = (s,el=document)=>el.querySelector(s);

const squareAB = {

    {t:()=>`Top-left piece: ${V("a")} × ${V("a")} = <span class="k-blue">${V("a")}²</span>`, show:{split:true,hi:"aa"}},

  ],
  mount(stage,panel,key,prm){

      const {a,b,step}=st, S=this.steps[step].show;

      const fade=k=>{ if(!S.split) return 1; if(!S.hi||S.hi==="all") return 1;

      if(!S.split){
        svg.append(svgEl("rect",{x:x0,y:y0,width:T,height:T,fill:"var(--blue-fill)",stroke:"var(--ink)","stroke-width":.8}));
        svg.append(svgEl("text",{x:x0+T/2,y:y0+T/2+2.5,"text-anchor":"middle","font-size":7,fill:"var(--ink)","font-style":"italic"},"(a + b)²"));
        svg.append(svgEl("text",{x:x0+T/2,y:y0-3.5,"text-anchor":"middle","font-size":6,fill:"var(--ink)","font-style":"italic"},`a + b = ${a+b}`));
        svg.append(svgEl("text",{x:x0-4,y:y0+T/2,"text-anchor":"middle","font-size":6,fill:"var(--ink)","font-style":"italic",transform:`rotate(-90 ${x0-4} ${y0+T/2})`},`a + b = ${a+b}`));
      } else {
        const piece=(x,y,w,hh,fill,lab,col,k,val)=>{

        lab(x0-3.5,y0+A/2+2,`a = ${a}`,"end"); lab(x0-3.5,y0+A+B/2+2,`b = ${b}`,"end");
        [[x0,y0-1.5,x0,y0-6],[x0+A,y0-1.5,x0+A,y0-6],[x0+T,y0-1.5,x0+T,y0-6],
         [x0-1.5,y0,x0-6,y0],[x0-1.5,y0+A,x0-6,y0+A],[x0-1.5,y0+T,x0-6,y0+T]]
         .forEach(([x1,y1,x2,y2])=>svg.append(svgEl("line",{x1,y1,x2,y2,stroke:"var(--muted)","stroke-width":.5})));
      }
      const tot=(a+b)**2;
      svg.append(svgEl("text",{x:72,y:118,"text-anchor":"middle","font-size":6.2,fill:"var(--ink)"},
        S.split?`${a*a} + ${2*a*b} + ${b*b} = ${tot}  =  (${a} + ${b})²`:`(${a} + ${b})² = ${tot}`));
      kb.innerHTML=FORMS([FB("blue",`(${V("a")} + ${V("b")})²`,`(${a} + ${b})² = ${tot}`,"the big square"),FB("amber",`${V("a")}² + 2${V("ab")} + ${V("b")}²`,`${a*a} + ${2*a*b} + ${b*b} = ${tot}`,"the 4 pieces ✓"),FB("red","✗ Common mistake",`${a}² + ${b}² = ${a*a+b*b}`,`forgets the 2 rectangles`)]); settleKey(kb);
      ro.innerHTML=""; ro.closest(".box").style.display="none";
      setStep(panel,this.steps,step);
    };
    sa.oninput=()=>{st.a=+sa.value;draw()}; sb.oninput=()=>{st.b=+sb.value;draw()};
    wireNav(panel,this.steps,st,draw);
    draw();
  }
};

const N=(v,d=2)=>{let s=fmt(v,d); if(s==="-0")s="0"; return s.replace("-","−")};
const PI=Math.PI, rad=d=>d*PI/180, deg=r=>r*180/PI, norm=a=>((a%360)+360)%360;
const X2=V("x")+"²", X1=V("x");
function toFrac(v){
  if(Math.abs(v-Math.round(v))<1e-9) return N(Math.round(v));
  for(let d=2;d<=96;d++){const n=v*d; if(Math.abs(n-Math.round(n))<1e-7) return (n<0?"−":"")+frac(Math.abs(Math.round(n)),d);}
  return N(v,3);
}
function fracTxt(v){
  if(Math.abs(v-Math.round(v))<1e-9) return N(Math.round(v));
  for(let d=2;d<=8;d++){const n=v*d; if(Math.abs(n-Math.round(n))<1e-7) return (n<0?"−":"")+"{"+Math.abs(Math.round(n))+"/"+d+"}";}
  return N(v);
}
function poly(cs){
  let out="";
  cs.forEach(([c,v])=>{ if(Math.abs(c)<1e-12) return; const neg=c<0, ac=Math.abs(c);
    const body=(v&&Math.abs(ac-1)<1e-12)?v:N(ac)+v;
    out+=out?(neg?" − ":" + ")+body:(neg?"−":"")+body; });
  return out||"0";
}
const br=(h,v=X1)=>Math.abs(h)<1e-12?v:`(${v} ${h>0?"−":"+"} ${N(Math.abs(h))})`;
const coefStr=a=>a===1?"":a===-1?"−":N(a);
const sf3=v=>N(+(+v).toPrecision(3),4);
const piFrac=dg=>{const v=dg/180; if(Math.abs(v)<1e-9) return "0"; for(let q=1;q<=12;q++){const p=v*q; if(Math.abs(p-Math.round(p))<1e-9){const P=Math.round(p), num=(P===1?"":P===-1?"−":P)+"π"; if(q===1) return num; return num.startsWith("−")?"−{"+num.slice(1)+"/"+q+"}":"{"+num+"/"+q+"}";}} return N(v*Math.PI,3);};
const AL='<span class="k-red">α</span>';
const CV=(c,s)=>`<i class="v k-${c}">${s}</i>`, CS=(c,t)=>`<span class="k-${c}">${t}</span>`;
const kStr=k=>Math.abs(k)<1e-12?"":(k>0?" + ":" − ")+N(Math.abs(k));

function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function dragger(svg,cb){
  let id=null;
  svg.addEventListener("pointerdown",e=>{const t=e.target.closest("[data-drag]"); if(!t) return;
    id=t.getAttribute("data-drag"); try{svg.setPointerCapture(e.pointerId)}catch(_){}; e.preventDefault(); cb(id,svgPt(svg,e));});
  svg.addEventListener("pointermove",e=>{ if(id){ e.preventDefault(); cb(id,svgPt(svg,e)); } });
  ["pointerup","pointercancel"].forEach(k=>svg.addEventListener(k,()=>{id=null}));
}
function handle(svg,x,y,id,col="var(--accent)"){
  svg.append(svgEl("circle",{cx:x,cy:y,r:7,fill:"transparent","data-drag":id,style:"cursor:grab"}));

function ringHandle(svg,x,y,id,tag=true){

  svg.append(svgEl("circle",{cx:x,cy:y,r:2.6,fill:"var(--card)",stroke:"var(--muted)","stroke-width":1,"pointer-events":"none"}));

}
const S_=(svg,tag,a,t)=>{const e=svgEl(tag,a,t); svg.append(e); if(tag==="text"&&t!=null&&/\{[^}]*\/[^}]*\}/.test(String(t))) fracify(e); return e};
const seg=(svg,P,Q,a={})=>S_(svg,"line",Object.assign({x1:P[0],y1:P[1],x2:Q[0],y2:Q[1],stroke:"var(--ink)","stroke-width":.7},a));
const lab=(svg,P,t,a={})=>S_(svg,"text",Object.assign({x:P[0],y:P[1],"font-size":4.6,fill:"var(--ink)","text-anchor":"middle"},a),t);
let fracN=0;
function fracify(el){
  const str=el.textContent; el.textContent="";
  str.split(/(\{[^}]*\})/).filter(Boolean).forEach(p=>{
    const m=p.match(/^\{([^/}]*)\/([^}]*)\}$/);

    el.append(svgEl("tspan",{dy:"-0.44em","data-fe":"1"},"​"));
  });

}
function layoutFracs(root){
  root.querySelectorAll("text[data-frac]").forEach(el=>{
    const id=el.getAttribute("data-frac"); root.querySelectorAll(`line[data-bar="${id}"]`).forEach(l=>l.remove());
    const nums=[...el.querySelectorAll("tspan[data-fn]")];
    nums.forEach(n=>{ const d=n.nextSibling, e=d.nextSibling; n.removeAttribute("dx"); d.removeAttribute("dx"); e.removeAttribute("dx"); });
    nums.forEach(n=>{ const d=n.nextSibling, e=d.nextSibling, wn=n.getComputedTextLength(), wd=d.getComputedTextLength(), W=Math.max(wn,wd)+0.5;
      n.setAttribute("dx",(W-wn)/2); d.setAttribute("dx",-(wn+(W-wn)/2)+(W-wd)/2); e.setAttribute("dx",(W-wd)/2); });
    const fs=parseFloat(el.getAttribute("font-size"))||4.6;

  });
}
const dirTo=(P,Q)=>deg(Math.atan2(-(Q[1]-P[1]),Q[0]-P[0]));
function arcMark(svg,c,r,a0,sw,col,label,lr=4.6){
  let d=""; const n=Math.max(6,Math.ceil(Math.abs(sw)/4));
  for(let i=0;i<=n;i++){const a=rad(a0+sw*i/n); d+=(i?"L":"M")+(c[0]+r*Math.cos(a)).toFixed(2)+" "+(c[1]-r*Math.sin(a)).toFixed(2);}
  S_(svg,"path",{d,fill:"none",stroke:col,"stroke-width":.9});
  if(label!=null){const a=rad(a0+sw/2),R=r+lr; S_(svg,"text",{x:c[0]+R*Math.cos(a),y:c[1]-R*Math.sin(a)+1.6,"text-anchor":"middle","font-size":4.2,fill:col,"font-weight":700},label);}
}

discrim:`${MUST([FB("green",`${V("b")}² − 4${V("ac")} &gt; 0`,"2 real, different roots","line CUTS the curve twice"),FB("amber",`${V("b")}² − 4${V("ac")} = 0`,"2 real, equal roots","line TOUCHES: a tangent"),FB("red",`${V("b")}² − 4${V("ac")} &lt; 0`,"no real roots","line MISSES the curve")])}
<div class="sheet">
  <div class="panelc"><h4>b² − 4ac and the roots of ax² + bx + c = 0</h4>
    <table>
      <tr><th>${V("b")}² − 4${V("ac")}</th><th>Roots</th><th>Graph</th></tr>
      <tr><td>&gt; 0</td><td>2 real, different roots</td><td>${miniQ(2)}</td></tr>
      <tr><td>= 0</td><td>2 real, equal roots</td><td>${miniQ(1)}</td></tr>
      <tr><td>&lt; 0</td><td>no real roots</td><td>${miniQ(0)}</td></tr>
    </table>
    <p class="anno">* "real roots" (any, equal or not) → ${V("b")}² − 4${V("ac")} ≥ 0</p>
  </div>

  <div class="panelc"><h4>Line and curve</h4>
    <ul class="steps">
      <li>① Substitute the line into the curve</li>
      <li>② Rearrange to (quadratic) = 0</li>
      <li>③ Use ${V("b")}² − 4${V("ac")} of <b>that</b> quadratic</li>
    </ul>
    <div class="piccards">
      ${PIC("#discriminant?m=1&c=3",miniLC(2),`cuts at 2 points`,`${V("b")}² − 4${V("ac")} &gt; 0`)}
      ${PIC("#discriminant?m=0&c=1",miniLC(1),`touches: a tangent`,`${V("b")}² − 4${V("ac")} = 0`)}
      ${PIC("#discriminant?m=0&c=-1",miniLC(0),`does not meet`,`${V("b")}² − 4${V("ac")} &lt; 0`)}
    </div>
    <p class="anno">* "meets / intersects" (any number of points) → ${V("b")}² − 4${V("ac")} ≥ 0</p>
  </div>

  <div class="panelc"><h4>Example: tangent</h4>
    <p>${V("y")} = ${X1} + ${V("k")} is a tangent to ${V("y")} = ${X2} − 3${X1} + 5. Find ${V("k")}.</p>
    <ul class="steps">
      <li>${X2} − 3${X1} + 5 = ${X1} + ${V("k")}</li>
      <li>${X2} − 4${X1} + (5 − ${V("k")}) = 0 <span class="tagop">a = 1, b = −4, c = 5 − k</span></li>
      <li>(−4)² − 4(1)(5 − ${V("k")}) = 0 <span class="tagop">tangent → = 0</span></li>
      <li>16 − 20 + 4${V("k")} = 0 → <b>${V("k")} = 1</b></li>
    </ul>
  </div>

  <div class="panelc"><h4>Always positive / always negative</h4>
    <table>
      <tr><th>${V("a")}${X2} + ${V("b")}${X1} + ${V("c")} is…</th><th>Conditions</th></tr>
      <tr><td>always positive (for all ${X1})</td><td>${V("a")} &gt; 0 <b>and</b> ${V("b")}² − 4${V("ac")} &lt; 0</td></tr>
      <tr><td>always negative (for all ${X1})</td><td>${V("a")} &lt; 0 <b>and</b> ${V("b")}² − 4${V("ac")} &lt; 0</td></tr>
    </table>
  </div>

  <div class="panelc"><h4>Note!</h4>
    <div class="wrongright">
      <div class="x">✗ using the line's ${V("c")} in ${V("b")}² − 4${V("ac")}</div>

    </div>
    <div class="note"><b>Note!</b> In the example above, ${V("c")} = 5 − ${V("k")}, not ${V("k")} and not 5.</div>
    <div class="note"><b>Note!</b> If ${V("k")} is in front of ${X2}, you also need ${V("a")} ≠ 0 for it to be a quadratic (and ${V("a")} &gt; 0 or ${V("a")} &lt; 0 for always positive / negative).</div>
  </div>
</div>`,

trigAngles:`${MUST([FB("red",`Basic angle ${AL}`,`${AL} = sin⁻¹, cos⁻¹ or tan⁻¹ of the POSITIVE value`,"always acute: cos⁻¹ 0.5 = 60°, even for cos θ = −0.5"),FB("blue","ASTC = which ratios are +",`A · S · T · C`,"All · Sin · Tan · Cos, anticlockwise from Q1"),FB("green",`θ from ${AL}`,`${AL} · ${nw(`180° − ${AL}`)} · ${nw(`180° + ${AL}`)} · ${nw(`360° − ${AL}`)}`,"quadrants 1 · 2 · 3 · 4")])}

    <div class="note"><b>Note!</b> tan has asymptotes (dashed lines it never touches) at ${X1} = ${frac("90°",V("b"))}, ${frac("270°",V("b"))}, …</div>
  </div>
</div>`,

rFormula:`${MUST([FB("blue",`${CV("blue","R")} = √(${V("a")}² + ${V("b")}²)`,"the hypotenuse","how tall the one wave is"),FB("red",`tan ${AL} = ${frac(V("b"),V("a"))}`,`${AL} acute`,"b over a, not a over b"),FB("amber","Max and min",`${V("R")} and −${V("R")}`,"sin and cos are never beyond ±1")])}
<div class="sheet">
  <div class="panelc"><h4>The 4 forms <span class="badge">memorise: not on the formula sheet</span></h4>
    <table>
      <tr><th>Expression</th><th>R-form</th></tr>
      <tr><td>${nw(`${V("a")} sin θ + ${V("b")} cos θ`)}</td><td>${nw(`${V("R")} sin(θ + α)`)}</td></tr>
      <tr><td>${nw(`${V("a")} sin θ − ${V("b")} cos θ`)}</td><td>${nw(`${V("R")} sin(θ − α)`)}</td></tr>
      <tr><td>${nw(`${V("a")} cos θ + ${V("b")} sin θ`)}</td><td>${nw(`${V("R")} cos(θ − α)`)}</td></tr>
      <tr><td>${nw(`${V("a")} cos θ − ${V("b")} sin θ`)}</td><td>${nw(`${V("R")} cos(θ + α)`)}</td></tr>
    </table>
    <p class="big">${nw(`${V("R")} = √(${V("a")}² + ${V("b")}²)`)} &nbsp;·&nbsp; ${nw(`tan ${AL} = ${frac(V("b"),V("a"))}`)}</p>
    <p class="anno">* ${V("a")}, ${V("b")} &gt; 0 and ${AL} acute. ${V("a")} = the number in front of the ratio named in the R-form.</p>
  </div>

  <div class="panelc"><h4>Where R and α come from</h4>
    <a href="#r-formula?mode=cos&a=3&b=4" class="piclink"><svg viewBox="0 0 220 98" style="width:100%;max-width:300px;display:block;margin:0 auto">
      <path d="M20 78 L110 78 L110 18 Z" fill="var(--blue-fill)" stroke="var(--ink)" stroke-width="1.2"/>
      <path d="M102 78 L102 70 L110 70" fill="none" stroke="var(--ink)"/>
      <path d="M44 78 A24 24 0 0 0 40 65" fill="none" stroke="var(--red)" stroke-width="1.5"/>
      <text x="50" y="72" font-size="13" fill="var(--red)" font-weight="700">α</text>
      <text x="65" y="92" font-size="13" text-anchor="middle" fill="var(--amber)" font-weight="700">a</text>
      <text x="116" y="52" font-size="13" fill="var(--green)" font-weight="700">b</text>
      <text x="56" y="40" font-size="13" fill="var(--blue)" font-weight="700">R</text>
      <text x="135" y="40" font-size="12" fill="var(--ink)">R = √(a² + b²)</text>
      <text x="135" y="60" font-size="12" fill="var(--ink)">tan α = b ÷ a</text>
    </svg></a>
    ${PLAYLINK("#r-formula","Play: two waves make one")}
  </div>

  <div class="panelc"><h4>Max and min</h4>
    <ul class="steps">
      <li>3 cos θ + 4 sin θ = 5 cos(θ − 53.13°)</li>
      <li>Max = <b>5</b> when θ − 53.13° = 0° → θ = 53.1°</li>
      <li>Min = <b>−5</b> when θ − 53.13° = 180° → θ = 233.1°</li>
    </ul>
    <p class="anno">* max = ${V("R")}, min = −${V("R")}, because sin and cos are always between −1 and 1</p>
  </div>

  <div class="panelc"><h4>Solve, step by step</h4>
    <p>3 cos θ + 4 sin θ = 2.5, for 0° ≤ θ ≤ 360°</p>
    <ul class="steps">
      <li>① 5 cos(θ − 53.13°) = 2.5</li>
      <li>② cos(θ − 53.13°) = 0.5 <span class="tagop">÷ 5</span></li>
      <li>③ Range: −53.13° ≤ θ − 53.13° ≤ 306.87° <span class="tagop">− 53.13° all round</span></li>
      <li>④ θ − 53.13° = 60° or 300° <span class="anno">(−60° is outside the range, so reject it)</span></li>
      <li>⑤ θ = <b>113.1°</b> or <b>353.1°</b></li>
    </ul>
  </div>

  <div class="panelc"><h4>Note!</h4>
    <div class="wrongright">
      <div class="x">✗ tan α = ${frac(V("a"),V("b"))}</div>
      <div class="ok">✓ tan α = ${frac(V("b"),V("a"))}</div>
    </div>
    <div class="note"><b>Note!</b> Keep α to 2 d.p. while working; give final angles to 1 d.p. Always shift the range in step ③ before solving.</div>
  </div>
</div>`,

diffApps:`${MUST([FB("blue",`${frac("d"+V("y"),"d"+V("x"))} = gradient of the tangent`,nw(`${V("y")} − ${V("y")}₁ = ${V("m")}(${X1} − ${X1}₁)`),"normal: gradient −1 ÷ m"),FB("amber","Stationary point",`${frac("d"+V("y"),"d"+V("x"))} = 0`,"flat tangent · find x AND y"),FB("green","Max or min?",`${frac("d²"+V("y"),"d"+V("x")+"²")} &lt; 0 max ∩ · &gt; 0 min ∪`,"= 0 → use the sign test")])}
<div class="sheet">
  <div class="panelc"><h4>Tangent and normal</h4>
    <a href="#tangent-gradient?cv=cubic&x=-1.5&nm=nor" class="piclink"><svg viewBox="0 0 200 80" style="width:100%;max-width:260px;display:block;margin:0 auto">
      <path d="M20 75 Q70 -10 180 20" fill="none" stroke="var(--blue)" stroke-width="2"/>
      <line x1="19.3" y1="61.2" x2="91.5" y2="7.5" stroke="var(--green)" stroke-width="1.6"/>
      <line x1="34.5" y1="6.3" x2="76.3" y2="62.5" stroke="var(--amber)" stroke-width="1.6"/>
      <circle cx="55.4" cy="34.4" r="3" fill="var(--ink)"/>
      <text x="94" y="12" font-size="12" fill="var(--green)">tangent</text><text x="80" y="66" font-size="12" fill="var(--amber)">normal</text>
    </svg></a>
    <ul class="steps">
      <li>Gradient of tangent ${V("m")} = ${frac("d"+V("y"),"d"+V("x"))} at that point</li>
      <li>Gradient of normal = −${frac("1",V("m"))} <span class="tagop">normal ⊥ tangent</span></li>
      <li>Equation: <span class="nw">${V("y")} − ${V("y")}₁ = ${V("m")}(${X1} − ${X1}₁)</span></li>
    </ul>
    <p class="anno">* if ${V("m")} = 0: tangent is ${V("y")} = ${V("y")}₁, normal is the vertical line ${X1} = ${X1}₁</p>
    <p class="anno">* ${V("y")} = ${X2} at (1, 1): ${V("m")} = 2 → tangent ${V("y")} = 2${X1} − 1; normal ${V("y")} = −${frac("1","2")}${X1} + ${frac("3","2")}</p>
    ${PLAYLINK("#tangent-gradient","Play: slide the tangent")}
  </div>

  <div class="panelc"><h4>Increasing, decreasing, stationary</h4>
    <table>
      <tr><th>${frac("d"+V("y"),"d"+V("x"))}</th><th>Meaning</th></tr>
      <tr><td>&gt; 0</td><td><span class="k-green">increasing ↗</span></td></tr>
      <tr><td>&lt; 0</td><td><span class="k-red">decreasing ↘</span></td></tr>
      <tr><td>= 0</td><td><span class="k-amber">stationary point</span> (find both ${X1} and ${V("y")})</td></tr>
    </table>
    <p class="anno">* "show increasing for all ${X1}": ${V("y")} = ${V("x")}³ + 3${X1} → ${frac("d"+V("y"),"d"+V("x"))} = 3${X2} + 3 &gt; 0, since ${X2} ≥ 0</p>
    <p class="anno">* "range of ${X1} for which ${V("y")} is increasing": solve ${frac("d"+V("y"),"d"+V("x"))} &gt; 0</p>
  </div>

  <div class="panelc"><h4>Max, min or inflexion?</h4>
    <div class="piccards">
      ${PIC("#tangent-gradient?cv=cubic&x=-1",shapeIcon("max","var(--amber)",72),"Maximum",`${frac("d²"+V("y"),"d"+V("x")+"²")} &lt; 0 · signs + 0 −`)}
      ${PIC("#tangent-gradient?cv=cubic&x=1",shapeIcon("min","var(--amber)",72),"Minimum",`${frac("d²"+V("y"),"d"+V("x")+"²")} &gt; 0 · signs − 0 +`)}
      ${PIC("#tangent-gradient?cv=cube&x=0",shapeIcon("infUp","var(--amber)",72),"Inflexion","signs + 0 + or − 0 −")}
    </div>
    <p class="anno">* ${frac("d²"+V("y"),"d"+V("x")+"²")} = 0 → this test can't tell. Use the sign test (it could be max, min or inflexion).</p>
    <ul class="steps">
      <li>${V("y")} = ${V("x")}³ − 3${X1} + 1 → ${frac("d"+V("y"),"d"+V("x"))} = 3${X2} − 3 = 0 <span class="nw">→ ${X1} = ±1</span></li>
      <li>${frac("d²"+V("y"),"d"+V("x")+"²")} = 6${X1}: at ${X1} = 1, 6 &gt; 0 → <b>min (1, −1)</b>; at ${X1} = −1, −6 &lt; 0 → <b>max (−1, 3)</b></li>
    </ul>
  </div>

  <div class="panelc"><h4>Connected rates</h4>
    <p class="big">${frac("d"+V("A"),"d"+V("t"))} = ${frac("d"+V("A"),"d"+V("r"))} × ${frac("d"+V("r"),"d"+V("t"))}</p>
    <p class="anno">* circle: ${V("A")} = π${V("r")}² → ${frac("d"+V("A"),"d"+V("r"))} = 2π${V("r")}. If ${frac("d"+V("r"),"d"+V("t"))} = 0.5 cm/s and ${V("r")} = 4: ${frac("d"+V("A"),"d"+V("t"))} = 2π(4) × 0.5 = 4π cm²/s</p>
  </div>

  <div class="panelc"><h4>Max / min word problems</h4>
    <ul class="steps">
      <li>① Write the quantity in <b>one</b> variable</li>
      <li>② Differentiate, put = 0, solve</li>
      <li>③ Check max or min with ${frac("d²"+V("y"),"d"+V("x")+"²")}</li>
      <li>④ Answer the question asked (often the max value, not ${X1})</li>
    </ul>
    <div class="note"><b>Note!</b> ${frac("d²"+V("y"),"d"+V("x")+"²")} = 0 does <b>not</b> mean inflexion. Check the sign of ${frac("d"+V("y"),"d"+V("x"))} on both sides.</div>
    <p class="anno">* the differentiation rules themselves: see <a href="#sheet/differentiation-rules">Differentiation rules</a></p>
  </div>
</div>`,

speedTime:`${MUST([FB("green","Gradient of speed–time graph","= acceleration","m/s² · flat = steady speed · downhill = slowing down"),FB("blue","Area under speed–time graph","= distance travelled","triangle · rectangle · trapezium"),FB("amber","km/h ↔ m/s","÷ 3.6 → m/s · × 3.6 → km/h","72 km/h = 20 m/s")])}
<div class="sheet">
  <div class="panelc"><h4>Speed–time graph</h4>
    <a href="#speed-time" class="piclink"><svg viewBox="0 0 220 100" style="width:100%;max-width:320px;display:block;margin:0 auto">
      <path d="M20 85 L70 25 L140 25 L200 85 Z" fill="var(--blue-fill)"/>
      <path d="M20 85 L70 25 L140 25 L200 85" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
      <line x1="15" y1="85" x2="212" y2="85" stroke="var(--ink)"/><line x1="20" y1="90" x2="20" y2="10" stroke="var(--ink)"/>
      <text x="45" y="48" font-size="11" fill="var(--green)" font-weight="700" transform="rotate(-50 45 48)">speeding up</text>
      <text x="105" y="20" font-size="11" fill="var(--ink)" text-anchor="middle">steady</text>
      <text x="168" y="44" font-size="11" fill="var(--red)" font-weight="700" transform="rotate(50 168 44)">slowing down</text>
      <text x="105" y="62" font-size="12" fill="var(--blue)" text-anchor="middle" font-weight="700">area = distance</text>
      <text x="206" y="97" font-size="10" fill="var(--muted)">t (s)</text><text x="4" y="14" font-size="10" fill="var(--muted)">v</text>
    </svg></a>
    <table>
      <tr><th>Part of the graph</th><th>Means</th></tr>
      <tr><td>sloping up</td><td>speeding up: acceleration = gradient = ${frac("change in speed","time")}</td></tr>
      <tr><td>flat</td><td>steady speed, acceleration 0</td></tr>
      <tr><td>sloping down</td><td>slowing down (deceleration): gradient is negative</td></tr>
      <tr><td>on the ${V("t")}-axis</td><td>stopped (speed 0)</td></tr>
    </table>
    ${PLAYLINK("#speed-time","Play: drag the corners")}
  </div>

  <div class="panelc"><h4>Distance = area under the graph</h4>
    <ul class="steps">
      <li>Triangle: ${frac("1","2")} × base × height</li>
      <li>Rectangle: base × height</li>
      <li>Trapezium: ${frac("1","2")} × (sum of parallel sides) × width</li>
    </ul>
    <p class="anno">* split the area at every corner, find each piece, add them up</p>
    <p class="anno">* average speed = ${frac("total distance","total time")} (NOT the average of the speeds)</p>
  </div>

  <div class="panelc"><h4>Distance–time graph (the other one)</h4>
    <table>
      <tr><th>Part of the graph</th><th>Means</th></tr>
      <tr><td>gradient</td><td><b>speed</b> = ${frac("distance","time")}</td></tr>
      <tr><td>flat</td><td>not moving</td></tr>
      <tr><td>steeper</td><td>faster</td></tr>
      <tr><td>curve getting steeper</td><td>speeding up</td></tr>
    </table>
    <div class="note"><b>Note!</b> Area under a distance–time graph means nothing. Area is only for the speed–time graph.</div>
  </div>

  <div class="panelc"><h4>Units: km/h ↔ m/s</h4>
    <ul class="steps">
      <li>1 km/h = ${frac("1000 m","3600 s")} = ${frac("5","18")} m/s</li>
      <li>km/h → m/s: <b>÷ 3.6</b> &nbsp; (72 km/h = 20 m/s)</li>
      <li>m/s → km/h: <b>× 3.6</b> &nbsp; (15 m/s = 54 km/h)</li>
    </ul>
    <p class="anno">* acceleration in m/s² needs speed in m/s and time in s. Convert first.</p>
  </div>

  <div class="panelc"><h4>Example</h4>
    <p>A car speeds up from rest to 12 m/s in 4 s, keeps 12 m/s for 6 s, then slows to a stop in 4 s.</p>
    <ul class="steps">
      <li>Acceleration in the first 4 s = ${frac("12 − 0","4")} = <b>3 m/s²</b></li>
      <li>Distance = ${frac("1","2")} × 4 × 12 + 6 × 12 + ${frac("1","2")} × 4 × 12 = 24 + 72 + 24 = <b>120 m</b></li>
      <li>Average speed = ${frac("120","14")} = <b>8.57 m/s</b> (3 s.f.)</li>
    </ul>
  </div>

  <div class="panelc"><h4>Note!</h4>
    <div class="wrongright">
      <div class="x">✗ slowing down 3 m/s²<br>written as "acceleration 3 m/s²"</div>
      <div class="ok">✓ acceleration = −3 m/s²<br>or "deceleration 3 m/s²"</div>
      <div class="x">✗ average speed = (0 + 12 + 0) ÷ 3</div>
      <div class="ok">✓ average speed = total distance ÷ total time</div>
    </div>
  </div>
</div>`,

kinematics:`${MUST([FB("blue",`Differentiate ${V("s")} → ${V("v")} → ${V("a")}`,`${nw(`${V("v")} = ${frac("d"+V("s"),"d"+V("t"))}`)} · ${nw(`${V("a")} = ${frac("d"+V("v"),"d"+V("t"))}`)}`,`integrate to go back: ${V("a")} → ${V("v")} → ${V("s")}`),FB("amber","At rest / turns round",`${V("v")} = 0`,"max displacement is where v = 0"),FB("red","Distance ≠ displacement","split the journey where v = 0","add the parts as positive numbers")])}
<div class="sheet">

  <div class="panelc"><h4>Exam phrases → what to do</h4>

  <div class="panelc"><h4>Distance travelled vs displacement</h4>
    <a href="#area-under?cv=lin&T=5" class="piclink"><svg viewBox="0 0 220 70" style="width:100%;max-width:300px;display:block;margin:0 auto">
      <path d="M20 10 L110 45 L110 45 Z" fill="var(--blue-fill)"/><path d="M20 10 L110 45 L20 45 Z" fill="var(--blue-fill)"/>

    </svg></a>
    <ul class="steps">
      <li>${V("v")} = 6 − 2${V("t")}: at rest when ${V("t")} = 3</li>
      <li>0 to 3 s: moves <b>+9 m</b> · 3 to 5 s: moves <b>−4 m</b> (backwards)</li>

function fitText(root,reset){ if(!root) return; if(reset) root._fit=null; const els=[...root.querySelectorAll(".formbox .eq, .khead")];
  const mem=(root._fit&&root._fit.length===els.length)?root._fit:(root._fit=new Array(els.length));
  els.forEach((el,i)=>{ el.style.fontSize=""; el.style.whiteSpace=""; const base=parseFloat(getComputedStyle(el).fontSize);
    let fs=(mem[i]&&mem[i]<base)?mem[i]:base; if(fs!==base) el.style.fontSize=fs+"px";
    const min=Math.max(12,base*.72);
    while(el.scrollWidth>el.clientWidth+1&&fs>min){ fs-=1; el.style.fontSize=fs+"px"; }
    if(el.scrollWidth>el.clientWidth+1) el.style.whiteSpace="normal";
    mem[i]=fs; });
  root.querySelectorAll(".formbox .rd, .formbox .hd").forEach(el=>{ el.style.fontSize=""; el.style.whiteSpace="nowrap";
    if(el.scrollWidth<=el.clientWidth+1){ el.style.whiteSpace=""; return; }
    const base=parseFloat(getComputedStyle(el).fontSize), need=el.scrollWidth/el.clientWidth;
    if(need>1.18){ el.style.whiteSpace=""; return; }
    let fs=base; const min=base*.85;
    while(el.scrollWidth>el.clientWidth+1&&fs>min){ fs-=.5; el.style.fontSize=fs+"px"; }
    if(el.scrollWidth>el.clientWidth+1){ el.style.whiteSpace=""; el.style.fontSize=""; } }); }

    const sb=h("input",{class:"search",type:"search",placeholder:"Search a chapter or topic…","aria-label":"Search cheatsheets"}); app.append(sb);
    LEVELS.forEach(l=>{
      const list=SHEETLIST.filter(s=>homeFilter==="all"?s.levels[0]===l.id:(homeFilter===l.id&&s.levels.includes(l.id))); if(!list.length) return;
      const sec=h("section",{class:"level"},`<h3>${l.name}</h3>`), rows=h("div",{class:"srows"});
      list.forEach(s=>rows.append(sheetRow(s))); sec.append(rows); app.append(sec);
    });
    const none=h("p",{class:"hint",hidden:""},"Nothing matches. Try another word."); app.append(none);
    sb.oninput=()=>{ const q=sb.value.trim().toLowerCase(); let any=false;
      app.querySelectorAll("section.level").forEach(sec=>{ let vis=0; sec.querySelectorAll(".srow").forEach(r=>{ const ok=!q||r.dataset.q.includes(q); r.hidden=!ok; if(ok) vis++; }); sec.hidden=!vis; any=any||vis>0; });
      none.hidden=any; };
  } else {
    const rec=recentTopics();
    if(rec.length){ const sec=h("section",{class:"level"},`<h3>Recently opened</h3>`), grid=h("div",{class:"cards"}); rec.forEach(t=>grid.append(cardFor(t))); sec.append(grid); app.append(sec); }
    const shown=TOPICS.filter(t=>homeFilter==="all"||t.levels.includes(homeFilter));
    STRANDS.forEach(([sid,sname])=>{
      const list=shown.filter(t=>t.strand===sid); if(!list.length) return;
      const sec=h("section",{class:"level"},`<h3>${sname}</h3>`), grid=h("div",{class:"cards"});
      list.forEach(t=>grid.append(cardFor(t)));
      sec.append(grid); app.append(sec);
    });
  }
  window.scrollTo(0,0);
}

function renderTopic(t,tab,prm){
  if(tab==="sheet"&&!t.sheet) tab="play";
  if(tab==="play"&&!t.play) tab="sheet";
  const lvl=LEVELS.find(l=>l.id===(t.levels.includes(homeFilter)?homeFilter:t.levels[0]));
  document.title=t.title+" · Maths Hub";
  titleEl.textContent=t.title; crumbEl.textContent=`${lvl.name} · ${t.chapter}`;
  backBtn.style.display="inline-flex"; shareBtn.hidden=qrBtn.hidden=false; presentBtn.hidden=zoomBtn.hidden=(tab!=="play");
  remember(t.id);
  cur={t,tab,state:null,stage:null,sheet:sheetForTopic(t)};
  app.innerHTML="";
  const tabs=h("div",{class:"tabs",role:"tablist"});
  [["play","▶ Play",t.play],["sheet","Cheatsheet",t.sheet]].forEach(([k,name,has])=>{
    if(!has) return;
    const b=h("button",{class:"tab",role:"tab","aria-selected":String(tab===k)},name);
    b.onclick=()=>{location.hash=t.id+(k==="sheet"?"/sheet":"")};
    tabs.append(b);
  });
  if(t.play&&t.sheet) app.append(tabs); else app.append(h("div",{style:"height:12px"}));
  if(tab==="play"){
    const wrap=h("div",{class:"play"}), left=h("div",{class:"left"}), stage=h("div",{class:"stage"}), key=h("div",{class:"key empty"}), panel=h("div",{class:"panel"});
    left.append(stage,key); wrap.append(left,panel); app.append(wrap);
    cur.stage=stage;
    PLAYS[t.play].mount(stage,panel,key,prm||new URLSearchParams());
    if(t.sheet) panel.append(h("a",{class:"pill sheetlink",href:"#"+t.id+"/sheet"},"Cheatsheet for this topic →"));
    placeDock();
  } else {
    app.insertAdjacentHTML("beforeend",`<h2 class="sheeth">${t.sheetTitle||t.chapter} — cheatsheet</h2>`+SHEETS[t.sheet]);
    fitMust();
  }
  window.scrollTo(0,0);
}
function fitMust(){ requestAnimationFrame(()=>fitText(document.querySelector(".must"),true)); }
function renderSheetOnly(s){
  const lvl=LEVELS.find(l=>l.id===(s.levels.includes(homeFilter)?homeFilter:s.levels[0]));
  document.title=s.title+" · Maths Hub";
  titleEl.textContent=s.title; crumbEl.textContent=`${lvl.name} · ${s.chapter}`;
  backBtn.style.display="inline-flex"; shareBtn.hidden=qrBtn.hidden=false; presentBtn.hidden=zoomBtn.hidden=true;
  cur={t:null,tab:"sheet",state:null,stage:null,sheet:s};
  app.innerHTML=`<div style="height:12px"></div><h2 class="sheeth">${s.title} — cheatsheet</h2>`+SHEETS[s.sheet];
  fitMust();
  window.scrollTo(0,0);
}

function route(){
  const raw=decodeURIComponent(location.hash.replace(/^#\/?/,""));
  const [path,qs]=raw.split("?"); const parts=path.split("/"); const prm=new URLSearchParams(qs||"");
  if(parts[0]==="sheet"&&parts[1]){ const s=sheetOf(parts[1]);
    if(s){ setHomeView("sheets"); const t=s.aid&&TOPICS.find(x=>x.id===s.aid); if(t) renderTopic(t,"sheet",prm); else renderSheetOnly(s); return; } }
  if(parts[0]==="sheets"||parts[0]==="play"){ setHomeView(parts[0]); exitPresent(); renderHome(); return; }
  const t=TOPICS.find(x=>x.id===parts[0]);
  if(t){ const tab=parts[1]==="sheet"?"sheet":"play"; setHomeView(tab==="sheet"?"sheets":"play"); renderTopic(t,tab,prm); }
  else { exitPresent(); renderHome(); }
}
function topicLink(){
  const base=location.href.split("#")[0]; if(!cur) return base;
  if(!cur.t) return cur.sheet?base+"#sheet/"+cur.sheet.id:base;
  let hsh="#"+cur.t.id+(cur.tab==="sheet"?"/sheet":"");
  if(cur.tab==="play"&&cur.state){ const p=new URLSearchParams(); Object.entries(cur.state()).forEach(([k,v])=>p.set(k,String(v))); const q=p.toString(); if(q) hsh+="?"+q; }
  return base+hsh;
}
backBtn.onclick=()=>{ location.hash=""; };
shareBtn.onclick=async()=>{
  const url=topicLink();
  try{
    if(matchMedia("(pointer:coarse)").matches&&navigator.share){ await navigator.share({title:document.title,url}); return; }
    await navigator.clipboard.writeText(url); toast("Link copied");
  }catch(e){ if(e&&e.name==="AbortError") return; try{ prompt("Copy this link:",url); }catch(_){} }
};
const qrModal=$("#qrModal"); let qrLib=null;
function loadQR(){ if(window.qrcode) return Promise.resolve(); if(!qrLib) qrLib=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"; s.onload=res; s.onerror=()=>{ qrLib=null; rej(); }; document.head.append(s); }); return qrLib; }
qrBtn.onclick=async()=>{
  const url=topicLink(); $("#qrTitle").textContent=cur&&cur.t?cur.t.title:cur&&cur.sheet?cur.sheet.title:"Maths Hub"; $("#qrUrl").textContent=url; $("#qrBox").innerHTML=""; qrModal.hidden=false;
  try{ await loadQR(); const q=qrcode(0,"M"); q.addData(url); q.make(); $("#qrBox").innerHTML=q.createSvgTag(6,2); }
  catch(e){ $("#qrBox").innerHTML='<p class="hint">The QR code needs internet. Share the link instead.</p>'; }
};
$("#qrClose").onclick=()=>{ qrModal.hidden=true; };
qrModal.onclick=e=>{ if(e.target===qrModal) qrModal.hidden=true; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ qrModal.hidden=true; exitPresent(); } });
const exitBtn=$("#exitPresent");
function enterPresent(){
  document.documentElement.setAttribute("data-present","1");
  try{ const el=document.documentElement, f=el.requestFullscreen||el.webkitRequestFullscreen; const p=f&&f.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  fitSoon(); requestAnimationFrame(()=>settleKey(document.querySelector(".keybox"),true));
}
function exitPresent(){
  if(!document.documentElement.hasAttribute("data-present")) return;
  document.documentElement.removeAttribute("data-present");
  try{ if(document.fullscreenElement||document.webkitFullscreenElement){ const f=document.exitFullscreen||document.webkitExitFullscreen; const p=f&&f.call(document); if(p&&p.catch) p.catch(()=>{}); } }catch(e){}
  fitSoon(); requestAnimationFrame(()=>settleKey(document.querySelector(".keybox"),true));
}
presentBtn.onclick=enterPresent; exitBtn.onclick=exitPresent;
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement) exitPresent(); });
document.addEventListener("webkitfullscreenchange",()=>{ if(!document.webkitFullscreenElement) exitPresent(); });
zoomBtn.onclick=()=>{ if(!cur||!cur.stage) return; const big=cur.stage.classList.toggle("big"); const l=big?"Smaller diagram":"Bigger diagram"; zoomBtn.setAttribute("aria-label",l); zoomBtn.title=l; };
let footTaps=0, footT=0;
document.querySelector("footer").addEventListener("click",()=>{ const now=Date.now(); footTaps=(now-footT<900)?footTaps+1:1; footT=now;
  if(footTaps>=3){ footTaps=0; toast(`${innerWidth} × ${innerHeight} px · ×${(devicePixelRatio||1).toFixed(2)} · text ${getComputedStyle(document.body).fontSize}`); } });
const barEl=document.querySelector(".bar");
const setBarH=()=>document.documentElement.style.setProperty("--barh",Math.round(barEl.getBoundingClientRect().height)+"px");
if(window.ResizeObserver) new ResizeObserver(setBarH).observe(barEl); else addEventListener("resize",setBarH);
setBarH();
const themeBtn=$("#themeBtn");
const SUN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
const MOON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const isDark=()=>document.documentElement.getAttribute("data-theme")==="dark";
function paintThemeBtn(){
  const lbl=isDark()?"Switch to light mode":"Switch to dark mode";
  themeBtn.innerHTML=isDark()?SUN:MOON;
  themeBtn.setAttribute("aria-label",lbl); themeBtn.title=lbl;
}
themeBtn.onclick=()=>{
  const t=isDark()?"light":"dark";
  hubTheme(t); try{localStorage.setItem("hubTheme",t)}catch(e){}
  paintThemeBtn();
};
const sysDark=matchMedia("(prefers-color-scheme: dark)");
const followDevice=()=>{ if(!hubSavedTheme()){ hubTheme(sysDark.matches?"dark":"light"); paintThemeBtn(); } };
if(sysDark.addEventListener) sysDark.addEventListener("change",followDevice); else if(sysDark.addListener) sysDark.addListener(followDevice);
let themeBeforePrint=null;
window.addEventListener("beforeprint",()=>{ themeBeforePrint=document.documentElement.getAttribute("data-theme"); hubTheme("light"); });
window.addEventListener("afterprint",()=>{ if(themeBeforePrint) hubTheme(themeBeforePrint); themeBeforePrint=null; });
paintThemeBtn();

const numOf=t=>parseFloat(String(t).replace(/−/g,"-").replace(/[^0-9.\-]/g,""));
function addNumBox(row){
  const r=$("input[type=range]",row), out=$("output",row); if(!r||!out||row._sync) return;
  const w=document.createElement("span"); w.className="numwrap";
  const b=document.createElement("input"); b.type="number"; b.className="numbox"; b.step="any";
  if(+r.min>=0) b.inputMode="decimal";
  b.setAttribute("aria-label",(r.getAttribute("aria-label")||$("label",row)?.textContent||"value")+" — type a number");
  const u=document.createElement("span"); u.className="unit";
  w.append(b,u); out.after(w); out.style.display="none";
  const shown=()=>numOf(out.textContent);
  row._sync=()=>{
    if(document.activeElement!==b){const v=shown(); const t=isNaN(v)?"":String(v); if(b.value!==t) b.value=t;}
    const un=((out.textContent.match(/([a-z°]+)\s*$/i)||[])[1])||""; if(u.textContent!==un) u.textContent=un;
    if(b.disabled!==r.disabled) b.disabled=r.disabled;
    if(row._stp) row._stp.forEach(x=>{ if(x.disabled!==r.disabled) x.disabled=r.disabled; });
  };
  const set=v=>{r.value=v; r.dispatchEvent(new Event("input",{bubbles:true}));};
  if((+r.max-+r.min)/(+r.step||1)<=200){
    const mk=(d,t)=>{ const bt=document.createElement("button"); bt.type="button"; bt.className="stp"; bt.textContent=t;
      bt.setAttribute("aria-label",(d<0?"Decrease ":"Increase ")+(r.getAttribute("aria-label")||"value"));
      bt.addEventListener("click",()=>{ const st=+r.step||1, dec=(String(st).split(".")[1]||"").length; const v=Math.min(+r.max,Math.max(+r.min,+r.value+d*st)); set(+v.toFixed(dec)); });
      return bt; };
    const mn=mk(-1,"−"), pl=mk(1,"+"); r.before(mn); out.after(pl); row._stp=[mn,pl];
  }
  const apply=()=>{
    const want=numOf(b.value); if(isNaN(want)){row._sync();return;}
    const lo=+r.min, hi=+r.max, st=+r.step||1;
    set(want);
    if(Math.abs(shown()-(+r.value))>1e-6){
      set(lo); const a=shown(); set(hi); const up=shown()>=a; let L=lo,H=hi;
      for(let i=0;i<40&&H-L>st;i++){const m=L+Math.max(1,Math.round((H-L)/2/st))*st; set(m); if((shown()<want)===up) L=m; else H=m;}
      set(L); const dL=Math.abs(shown()-want); set(H); if(dL<=Math.abs(shown()-want)) set(L);
    }
    const got=shown(); b.blur(); row._sync();
    if(Math.abs(got-want)>Math.max(st,1e-9)){b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),900);}
  };
  b.addEventListener("focus",()=>b.select());
  b.addEventListener("change",apply);
  b.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); b.blur();}});
  row._sync();
}
new MutationObserver(()=>document.querySelectorAll(".ctrl").forEach(row=>{addNumBox(row); row._sync&&row._sync();}))
  .observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["disabled"]});

let fitQ=0;
function fitStage(){fitQ=0; const left=document.querySelector(".left"), st=document.querySelector(".stage"), svg=st&&st.querySelector(":scope>svg"); if(!svg||!left) return;
  if(innerWidth<900){svg.style.maxHeight=""; return;}
  const top=left.getBoundingClientRect().top+scrollY, other=left.getBoundingClientRect().height-svg.getBoundingClientRect().height;
  const m=Math.max(240, Math.floor(innerHeight-12-top-other)); if(svg.style.maxHeight!==m+"px") svg.style.maxHeight=m+"px";}
const fitSoon=()=>{if(!fitQ) fitQ=requestAnimationFrame(fitStage)};
function placeDock(){
  const play=document.querySelector(".play"); if(!play) return;
  const dock=play.querySelector(".box.dock"), panel=play.querySelector(".panel"), slot=play.querySelector(".dockslot"); if(!dock||!panel) return;
  const docked=innerWidth<900&&innerHeight>=600;
  if(docked){ if(dock.parentElement!==play) play.append(dock); }
  else if(dock.parentElement!==panel){ if(slot) slot.after(dock); else panel.prepend(dock); }
}
addEventListener("resize",()=>{ placeDock(); fitSoon(); settleKey(document.querySelector(".keybox"),true); fitMust(); });
new MutationObserver(fitSoon).observe(document.body,{childList:true,subtree:true});
window.addEventListener("hashchange",route);
route();
fitSoon();
</script>
</body>
